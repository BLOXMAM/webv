<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>الصفحة غير موجودة</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --card-bg: #ffffff;
            --icon-bg: #eff6ff;
        }

        /* دعم الوضع الليلي تلقائياً */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --text-main: #f8fafc;
                --text-sub: #94a3b8;
                --primary: #3b82f6;
                --primary-hover: #60a5fa;
                --card-bg: #1e293b;
                --icon-bg: #1e3a8a;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* منع تحديد النصوص لإعطاء شعور التطبيقات */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden; /* منع التمرير */
        }

        .container {
            text-align: center;
            max-width: 360px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 32px 24px;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            animation: fadeIn 0.4s ease-out;
        }

        .icon-box {
            width: 90px;
            height: 90px;
            background-color: var(--icon-bg);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
        }

        .icon-box svg {
            width: 48px;
            height: 48px;
            fill: var(--primary);
        }

        .error-code {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-sub);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">
            <!-- أيقونة رابط مكسور / صفحة مفقودة -->
            <svg viewBox="0 0 24 24">
                <path d="M11 15h2v2h-2zm0-8h2v6h-2zm1-5C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
            </svg>
        </div>

        <div class="error-code">خطأ 404</div>
        <h1>الصفحة غير موجودة</h1>
        <p>الصفحة التي تحاول الوصول إليها غير موجودة أو تم نقلها لمكان آخر.</p>

        <div class="btn-group">
        <button class="btn btn-primary" onclick="goHome()">الرجوع للرئيسية</button>
            <button class="btn btn-secondary" onclick="retryLoad()">إعادة المحاولة</button>
            
        </div>
    </div>

    <script>
        // إعادة تحميل الصفحة
        function retryLoad() {
            window.location.reload();
        }

        // العودة للصفحة الرئيسية الخاصة بالتطبيق
        function goHome() {
            // قم بتغيير 'index.html' أو الرابط الرئيسي لتطبيقك
            window.location.href = 'home.html'; 
        }
    </script>
</body>
</html>
