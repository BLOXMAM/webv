<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جاري التحضير...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d12;
    --panel:#11161d;
    --panel-2:#161c25;
    --line:#232b36;
    --text:#e6edf3;
    --muted:#7d8896;
    --purple:#a371f7;
    --purple-2:#6366f1;
    --purple-dim:#241a3a;
    --info:#0ea5e9;
    --info-dim:#0a2430;
    --amber:#d29922;
    --radius:16px;
    --sans:'IBM Plex Sans Arabic', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1100px 550px at 85% -10%, rgba(163,113,247,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(14,165,233,.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ---------- شاشات الحالة ---------- */
  .screen{
    width:100%; max-width:420px; text-align:center;
    display:none; flex-direction:column; align-items:center;
    animation:riseIn .5s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .screen.active{display:flex;}
  @keyframes riseIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}

  /* شعار/أيقونة التطبيق */
  .brand-mark{
    width:84px; height:84px; border-radius:22px; margin-bottom:26px;
    background:linear-gradient(135deg, var(--purple-2), var(--purple));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 34px rgba(163,113,247,.35);
    position:relative;
  }
  .brand-mark svg{width:38px; height:38px; stroke:#fff; fill:none; stroke-width:1.8;}

  /* حلقة تحميل تحيط بالشعار */
  .ring-wrap{position:relative; width:112px; height:112px; margin-bottom:26px; display:flex; align-items:center; justify-content:center;}
  .ring-wrap .brand-mark{margin-bottom:0; position:absolute;}
  .ring{
    position:absolute; inset:0;
    border-radius:50%;
    border:3px solid rgba(163,113,247,.14);
    border-top-color:var(--purple);
    animation:spin 1.1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  h1.title{font-size:20px; font-weight:700; margin-bottom:10px;}
  p.desc{font-size:13.5px; color:var(--muted); line-height:1.9; max-width:340px;}

  /* شريط تقدم حقيقي (تتحكم فيه الواجهة الأصلية عبر setSyncProgress) */
  .progress-track{
    width:100%; max-width:280px; height:6px; border-radius:20px;
    background:var(--panel-2); border:1px solid var(--line);
    margin:22px 0 6px; overflow:hidden;
  }
  .progress-fill{
    height:100%; width:8%; border-radius:20px;
    background:linear-gradient(90deg, var(--purple-2), var(--purple));
    transition:width .5s ease;
  }
  .progress-pct{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums;}

  /* أيقونة الاتصال / الخطأ */
  .status-icon{
    width:84px; height:84px; border-radius:50%; margin-bottom:24px;
    display:flex; align-items:center; justify-content:center;
    background:var(--info-dim);
  }
  .status-icon svg{width:36px; height:36px; stroke:var(--info); fill:none; stroke-width:1.8;}

  .retry-btn{
    all:unset; cursor:pointer; margin-top:24px;
    background:linear-gradient(135deg, var(--purple-2), var(--purple));
    color:#fff; font-size:14px; font-weight:600;
    padding:12px 30px; border-radius:12px;
    box-shadow:0 8px 22px rgba(99,102,241,.35);
    transition:.15s;
  }
  .retry-btn:active{transform:scale(.97);}

  .dots span{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--purple); margin:0 2px; animation:blink 1.4s infinite;}
  .dots span:nth-child(2){animation-delay:.2s;}
  .dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.2;} 40%{opacity:1;}}

  /* ---------- Snackbar ---------- */
  #snackbar{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(120%);
    display:flex; align-items:center; gap:12px;
    background:var(--panel-2); border:1px solid var(--line);
    padding:13px 18px; border-radius:14px;
    box-shadow:0 14px 34px rgba(0,0,0,.45);
    max-width:calc(100% - 40px); width:380px;
    opacity:0; transition:transform .4s cubic-bezier(.2,.8,.2,1), opacity .4s ease;
    z-index:50;
  }
  #snackbar.show{transform:translateX(-50%) translateY(0); opacity:1;}
  #snackbar .sb-spin{
    width:16px; height:16px; flex-shrink:0; border-radius:50%;
    border:2px solid rgba(163,113,247,.25); border-top-color:var(--purple);
    animation:spin 1s linear infinite;
  }
  #snackbar .sb-text{font-size:12.5px; color:var(--text); line-height:1.6; flex:1;}
  #snackbar .sb-text b{color:var(--purple); font-weight:600;}

  @media (max-width:380px){
    .screen{max-width:100%;}
    h1.title{font-size:18px;}
  }
</style>
</head>
<body>

  <!-- ============ شاشة التحضير / المزامنة (الافتراضية) ============ -->
  <section class="screen active" id="view-syncing">
    <div class="ring-wrap">
      <div class="ring"></div>
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v3m0 12v3m9-9h-3M6 12H3m14.5-6.5-2 2m-9 9-2 2m13 0-2-2m-9-9-2-2"/></svg>
      </div>
    </div>
    <h1 class="title">جاري تحضير التطبيق</h1>
    <p class="desc">نقوم بمزامنة البيانات وتجهيز كل شيء ليكون جاهزًا لك<span class="dots"><span></span><span></span><span></span></span></p>

    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-pct" id="progressPct">8%</div>
  </section>

  <!-- ============ شاشة عدم الاتصال بالإنترنت (حالة حقيقية) ============ -->
  <section class="screen" id="view-offline">
    <div class="status-icon" style="background:rgba(14,165,233,.12);">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2 8.5a17 17 0 0 1 20 0M5.5 12a12 12 0 0 1 13 0M9 15.5a7 7 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg>
    </div>
    <h1 class="title">لا يوجد اتصال بالإنترنت</h1>
    <p class="desc">يرجى التأكد من تفعيل بيانات الجوال أو الاتصال بشبكة Wi-Fi للمتابعة في تحميل بيانات التطبيق.</p>
    <button class="retry-btn" id="retryBtn">إعادة المحاولة</button>
  </section>

  <!-- ============ Snackbar تفاعلي ============ -->
  <div id="snackbar">
    <span class="sb-spin"></span>
    <span class="sb-text" id="snackbarText">الرجاء الانتظار ريثما يتم إعداد <b>اللوحة</b>...</span>
  </div>

<script>
/* =====================================================================
   الحالة والعناصر
   ===================================================================== */
const viewSyncing = document.getElementById('view-syncing');
const viewOffline = document.getElementById('view-offline');
const snackbar     = document.getElementById('snackbar');
const snackbarText = document.getElementById('snackbarText');
const progressFill = document.getElementById('progressFill');
const progressPct  = document.getElementById('progressPct');
const retryBtn     = document.getElementById('retryBtn');

let currentProgress = 8;
let snackbarTimer = null;
let reassureTimer = null;

function showView(view) {
  [viewSyncing, viewOffline].forEach(v => v.classList.remove('active'));
  view.classList.add('active');
}

/* =====================================================================
   شريط تقدم حقيقي — تتحكم فيه الواجهة الأصلية (WebView/Android) عبر:
   window.setSyncProgress(percent)   مثال: setSyncProgress(42)
   window.setSyncStatus(text)        لتحديث نص الـ Snackbar بأي رسالة حقيقية
   هذا يبقي الشاشة صادقة ومرتبطة بما يحدث فعليًا في الخلفية بدل محاكاته
   ===================================================================== */
window.setSyncProgress = function (percent) {
  currentProgress = Math.max(0, Math.min(100, Math.round(percent)));
  progressFill.style.width = currentProgress + '%';
  progressPct.textContent = currentProgress + '%';
};

window.setSyncStatus = function (text) {
  if (text) snackbarText.innerHTML = text;
  bumpSnackbar();
};

/* إظهار الـ Snackbar مع تجديد مؤقت الإخفاء التلقائي */
function bumpSnackbar() {
  snackbar.classList.add('show');
  clearTimeout(snackbarTimer);
  snackbarTimer = setTimeout(() => snackbar.classList.remove('show'), 5200);
}

/* =====================================================================
   منطق الاتصال بالإنترنت — حالة حقيقية فقط، بدون رسائل خطأ مُصطنعة
   ===================================================================== */
function checkConnectivity() {
  if (navigator.onLine) {
    showView(viewSyncing);
  } else {
    showView(viewOffline);
    snackbar.classList.remove('show');
  }
}
window.addEventListener('online', checkConnectivity);
window.addEventListener('offline', checkConnectivity);
retryBtn.addEventListener('click', checkConnectivity);
checkConnectivity();

/* =====================================================================
   دورة رسائل الطمأنة أثناء الانتظار — صادقة وغير مخيفة،
   تظهر بعد لحظة قصيرة من فتح التطبيق ثم تتجدّد دوريًا
   ===================================================================== */
const reassureMessages = [
  'الرجاء الانتظار ريثما يتم إعداد <b>اللوحة</b>...',
  'لا يزال التحضير جاريًا، الأمر لن يستغرق طويلاً...',
  'نكاد ننتهي من التجهيز، شكرًا لصبرك...'
];
let reassureIndex = 0;

function startReassureLoop() {
  bumpSnackbar();
  reassureTimer = setInterval(() => {
    if (!navigator.onLine) return;
    reassureIndex = (reassureIndex + 1) % reassureMessages.length;
    snackbarText.innerHTML = reassureMessages[reassureIndex];
    bumpSnackbar();
  }, 9000);
}
setTimeout(startReassureLoop, 900);
</script>
</body>
</html>
