<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERDECK // CORE MONITOR v4.0.9</title>
    <style>
        :root {
            --bg-color: #050811;
            --panel-bg: rgba(10, 16, 30, 0.75);
            --border-color: #00f0ff;
            --text-main: #e0f7fc;
            --text-dim: #5c8099;
            --accent-cyan: #00f0ff;
            --accent-magenta: #ff0055;
            --accent-yellow: #ffe600;
            --accent-green: #00ff66;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-mono);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Matrix Background */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.25;
        }

        /* CRT Overlay Effect */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            z-index: 999;
        }

        /* App Layout */
        .app-container {
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.2);
        }

        .title-group h1 {
            font-size: 1.8rem;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px var(--accent-cyan);
            letter-spacing: 2px;
        }

        .system-status {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
        }

        .status-badge {
            padding: 5px 10px;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            background: rgba(0, 255, 102, 0.1);
            border-radius: 3px;
            animation: pulse 2s infinite;
        }

        /* Dashboard Grid */
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 4px;
            padding: 15px;
            backdrop-filter: blur(5px);
            position: relative;
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.05);
        }

        .panel::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px;
            width: 10px; height: 10px;
            border-top: 2px solid var(--accent-cyan);
            border-left: 2px solid var(--accent-cyan);
        }

        .panel-header {
            font-size: 1rem;
            color: var(--accent-cyan);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed rgba(0, 240, 255, 0.2);
            padding-bottom: 5px;
        }

        /* Grid Spans */
        .col-4 { grid-column: span 4; }
        .col-8 { grid-column: span 8; }
        .col-12 { grid-column: span 12; }

        @media (max-width: 1024px) {
            .col-4, .col-8 { grid-column: span 12; }
        }

        /* Interactive Controls */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        input[type="range"] {
            appearance: none;
            background: #101c33;
            border: 1px solid var(--border-color);
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent-cyan);
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        .btn-cyber {
            background: transparent;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 8px 16px;
            font-family: var(--font-mono);
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-cyber:hover {
            background: var(--accent-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--accent-cyan);
        }

        .btn-danger {
            border-color: var(--accent-magenta);
            color: var(--accent-magenta);
        }

        .btn-danger:hover {
            background: var(--accent-magenta);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--accent-magenta);
        }

        /* Terminal Console */
        .terminal {
            background: #02040a;
            border: 1px solid #1a2942;
            height: 180px;
            padding: 10px;
            overflow-y: auto;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-entry {
            line-height: 1.3;
        }
        .log-entry.info { color: var(--text-dim); }
        .log-entry.warn { color: var(--accent-yellow); }
        .log-entry.error { color: var(--accent-magenta); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>



    <canvas id="matrix-bg"></canvas>
    <div class="scanlines"></div>

    <div class="app-container">
        <header>
            <div class="title-group">
                <h1>CORE_MONITOR // SYSTEM OS</h1>
            </div>
            <div class="system-status">
                <span>CPU: <strong id="cpu-stat">0%</strong></span>
                <span>MEM: <strong id="mem-stat">0%</strong></span>
                <div class="status-badge">ONLINE</div>
            </div>
        </header>

        <div class="grid-layout">
            <!-- Realtime Canvas Chart Panel -->
            <div class="panel col-8">
                <div class="panel-header">
                    <span>مراقبة الشبكة والمعالجة الحية</span>
                    <span style="color: var(--accent-magenta)">REAL-TIME TELEMETRY</span>
                </div>
                <canvas id="realtime-chart" height="220" style="width: 100%;"></canvas>
            </div>

            <!-- Controls Panel -->
            <div class="panel col-4">
                <div class="panel-header">
                    <span>لوحة التحكم بالمحاكاة</span>
                    <span>CONTROLS</span>
                </div>
                <div class="control-group">
                    <div class="control-item">
                        <label for="freq-slider">تردد الإشارة (Frequency)</label>
                        <input type="range" id="freq-slider" min="1" max="10" value="3">
                    </div>
                    <div class="control-item">
                        <label for="noise-slider">مستوى الضوضاء (Noise/Volatility)</label>
                        <input type="range" id="noise-slider" min="0" max="50" value="15">
                    </div>
                    <div class="control-item">
                        <label>نمط النظام</label>
                        <button class="btn-cyber" id="toggle-theme">تبديل الثيم</button>
                    </div>
                    <hr style="border-color: rgba(0, 240, 255, 0.1); margin: 5px 0;">
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-cyber" id="btn-trigger-warn">تحذير</button>
                        <button class="btn-cyber btn-danger" id="btn-trigger-error">خطأ للنظام</button>
                    </div>
                </div>
            </div>

            <!-- Terminal Console Panel -->
            <div class="panel col-12">
                <div class="panel-header">
                    <span>سجل الأحداث البرمجي (System Log Console)</span>
                    <span id="clear-log" style="cursor: pointer; text-decoration: underline;">مسح السجل</span>
                </div>
                <div class="terminal" id="terminal-out">
                    <div class="log-entry info">[SYSTEM]: Initializing Neural Interface v4.0.9...</div>
                    <div class="log-entry info">[SYSTEM]: Matrix Digital Rain canvas attached successfully.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * 1. Matrix Rain Background Logic
         */
        const matrixCanvas = document.getElementById('matrix-bg');
        const mCtx = matrixCanvas.getContext('2d');

        function resizeMatrix() {
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
        }
        resizeMatrix();
        window.addEventListener('resize', resizeMatrix);

        const chars = '011001010101101010101010101101101001011010101001101';
        const fontSize = 14;
        let columns = Math.floor(matrixCanvas.width / fontSize);
        let drops = Array(columns).fill(1);

        function drawMatrix() {
            mCtx.fillStyle = 'rgba(5, 8, 17, 0.08)';
            mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);

            mCtx.fillStyle = '#00f0ff';
            mCtx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                mCtx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        /**
         * 2. Real-time Waveform Canvas Chart
         */
        const chartCanvas = document.getElementById('realtime-chart');
        const cCtx = chartCanvas.getContext('2d');

        let dataPoints = new Array(100).fill(50);
        let phase = 0;

        function drawChart() {
            const width = chartCanvas.width = chartCanvas.offsetWidth;
            const height = chartCanvas.height = chartCanvas.offsetHeight;

            cCtx.clearRect(0, 0, width, height);

            // Draw Grid Lines
            cCtx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
            cCtx.lineWidth = 1;

            const gridStep = 25;
            for (let x = 0; x < width; x += gridStep) {
                cCtx.beginPath();
                cCtx.moveTo(x, 0);
                cCtx.lineTo(x, height);
                cCtx.stroke();
            }
            for (let y = 0; y < height; y += gridStep) {
                cCtx.beginPath();
                cCtx.moveTo(0, y);
                cCtx.lineTo(width, y);
                cCtx.stroke();
            }

            // Waveform Calculations
            const freq = parseFloat(document.getElementById('freq-slider').value) * 0.02;
            const noise = parseFloat(document.getElementById('noise-slider').value);
            
            phase += freq;
            const newVal = Math.sin(phase) * 30 + (Math.random() - 0.5) * noise + (height / 2);

            dataPoints.push(newVal);
            if (dataPoints.length > width / 6) {
                dataPoints.shift();
            }

            // Draw Waveform Line
            cCtx.beginPath();
            cCtx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent-cyan').trim();
            cCtx.lineWidth = 2;
            cCtx.shadowBlur = 8;
            cCtx.shadowColor = cCtx.strokeStyle;

            const sliceWidth = width / (dataPoints.length - 1);
            for (let i = 0; i < dataPoints.length; i++) {
                const x = i * sliceWidth;
                const y = dataPoints[i];

                if (i === 0) cCtx.moveTo(x, y);
                else cCtx.lineTo(x, y);
            }
            cCtx.stroke();
            cCtx.shadowBlur = 0; // Reset shadow

            // Update Header Stats
            const currentCpu = Math.min(100, Math.max(10, Math.round((newVal / height) * 100)));
            document.getElementById('cpu-stat').innerText = currentCpu + '%';
            document.getElementById('mem-stat').innerText = Math.round(currentCpu * 0.85) + '%';
        }

        /**
         * 3. Terminal Logging Engine
         */
        const terminal = document.getElementById('terminal-out');

        function appendLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toISOString().split('T')[1].slice(0, 8);
            entry.innerText = `[${time}] ${message}`;
            terminal.appendChild(entry);
            terminal.scrollTop = terminal.scrollHeight;
        }

        document.getElementById('clear-log').addEventListener('click', () => {
            terminal.innerHTML = '';
        });

        document.getElementById('btn-trigger-warn').addEventListener('click', () => {
            appendLog('WARNING: High memory latency detected on sector 0x7F', 'warn');
        });

        document.getElementById('btn-trigger-error').addEventListener('click', () => {
            appendLog('CRITICAL: Kernel panic simulation triggered in core 2', 'error');
        });

        /**
         * 4. Theme Toggle Logic (CSS Variables Modulation)
         */
        let altTheme = false;
        document.getElementById('toggle-theme').addEventListener('click', () => {
            altTheme = !altTheme;
            const root = document.documentElement;

            if (altTheme) {
                root.style.setProperty('--accent-cyan', '#ff0055');
                root.style.setProperty('--border-color', '#ff0055');
                appendLog('UI Accent Color shifted to MAGENTA Spectrum.', 'info');
            } else {
                root.style.setProperty('--accent-cyan', '#00f0ff');
                root.style.setProperty('--border-color', '#00f0ff');
                appendLog('UI Accent Color restored to CYAN Spectrum.', 'info');
            }
        });

        /**
         * 5. Master Render Loop
         */
        function animate() {
            drawMatrix();
            drawChart();
            requestAnimationFrame(animate);
        }

        animate();

        // Periodic Random Event Logger
        setInterval(() => {
            const events = [
                "Ping response from 192.168.1.104: 12ms",
                "Automated garbage collection complete.",
                "Handshake established with Node-Alpha.",
                "Background thread index synchronized."
            ];
            if (Math.random() > 0.6) {
                const randomMsg = events[Math.floor(Math.random() * events.length)];
                appendLog(randomMsg, 'info');
            }
        }, 4000);
    </script>
</body>
</html>
