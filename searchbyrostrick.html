<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محرك البحث الفضائي - Horizontal 3D</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- مكتبة Three.js للخلفية الفضائية ثلاثية الأبعاد -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --rt-accent: #00f2fe;
    --rt-accent-glow: rgba(0, 242, 254, 0.4);
    --rt-card: rgba(10, 15, 30, 0.82);
    --rt-text: #f0f4f8;
    --rt-muted: #8a99ad;
    --rt-border: rgba(0, 242, 254, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Cairo", "Tahoma", sans-serif; }

  body {
    background-color: #010409;
    color: var(--rt-text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }

  /* حاوية خلفية Three.js 3D الفضائية التي تعمل بلا توقف 24h */
  #space-canvas {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: -1;
    pointer-events: none;
  }

  /* الهيكل العام للصفحة */
  .space-main-wrapper {
    width: 100%;
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 35px;
  }

  /* الهيدر العلوي */
  .space-hud-header {
    background: var(--rt-card);
    backdrop-filter: blur(18px);
    border: 1px solid var(--rt-border);
    border-radius: 24px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 0 50px rgba(0, 242, 254, 0.15);
    position: relative;
    overflow: hidden;
  }

  .space-hud-header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--rt-accent), transparent);
  }

  .space-hud-header i {
    font-size: 2.8rem;
    color: var(--rt-accent);
    margin-bottom: 12px;
    text-shadow: 0 0 20px var(--rt-accent);
  }

  .space-hud-header h1 {
    font-size: 1.9rem;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }

  .space-hud-header p {
    color: var(--rt-muted);
    font-size: 0.95rem;
  }

  .space-counter-tag {
    display: inline-block;
    background: rgba(0, 242, 254, 0.1);
    color: var(--rt-accent);
    padding: 6px 18px;
    border-radius: 30px;
    font-size: 0.85rem;
    margin-top: 14px;
    border: 1px solid var(--rt-border);
    box-shadow: inset 0 0 10px rgba(0, 242, 254, 0.2);
  }

  /* تم التعديل إلى r-search-box حسب رغبتك */
  .r-search-box {
    background: var(--rt-card);
    backdrop-filter: blur(14px);
    border-radius: 18px;
    border: 1px solid var(--rt-border);
    padding: 18px 24px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
  }

  /* قائمة الصفحات بشكل شريط أفقي قابل للتمرير الجانبي */
  .rt-search-results, .rt-pages-list {
    display: flex !important;
    flex-direction: row !important;
    overflow-x: auto !important;
    gap: 20px !important;
    padding: 15px 5px 25px 5px !important;
    width: 100% !important;
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: var(--rt-accent) rgba(255,255,255,0.05);
  }

  .rt-search-results::-webkit-scrollbar, 
  .rt-pages-list::-webkit-scrollbar {
    height: 8px;
  }
  .rt-search-results::-webkit-scrollbar-track, 
  .rt-pages-list::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.03);
    border-radius: 10px;
  }
  .rt-search-results::-webkit-scrollbar-thumb, 
  .rt-pages-list::-webkit-scrollbar-thumb {
    background: var(--rt-accent);
    border-radius: 10px;
    box-shadow: 0 0 10px var(--rt-accent);
  }

  /* تصميم البطاقات الأفقية الفردية (Cards) */
  .rt-search-item {
    background: var(--rt-card) !important;
    backdrop-filter: blur(12px) !important;
    border-radius: 18px !important;
    padding: 22px !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: flex-start !important;
    justify-content: space-between !important;
    gap: 16px !important;
    min-width: 280px !important;
    max-width: 280px !important;
    height: 180px !important;
    border: 1px solid var(--rt-border) !important;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5) !important;
    text-decoration: none !important;
    color: var(--rt-text) !important;
    flex-shrink: 0 !important;
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1) !important;
    position: relative;
    overflow: hidden;
  }

  .rt-search-item::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; width: 100%; height: 3px;
    background: linear-gradient(90deg, var(--rt-accent), transparent);
    opacity: 0.4;
    transition: opacity 0.3s;
  }

  .rt-search-item:hover {
    transform: translateY(-8px) scale(1.02);
    border-color: var(--rt-accent) !important;
    box-shadow: 0 15px 45px var(--rt-accent-glow) !important;
    background: rgba(18, 27, 48, 0.9) !important;
  }

  .rt-search-item:hover::after {
    opacity: 1;
  }

  .rt-search-item i {
    color: #010409 !important;
    background: var(--rt-accent) !important;
    width: 48px !important;
    height: 48px !important;
    border-radius: 14px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 1.2rem !important;
    box-shadow: 0 0 15px var(--rt-accent) !important;
    flex-shrink: 0 !important;
  }

  .rt-search-item span {
    font-weight: 700 !important;
    font-size: 1.05rem !important;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .section-label {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--rt-muted);
    margin-bottom: -10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label i {
    color: var(--rt-accent);
  }
</style>
</head>
<body>

  <!-- حاوية مشهد الفضاء 3D تفاعلي يعمل 24 ساعة -->
  <div id="space-canvas"></div>

  <!-- الهيكل الرئيسي -->
  <div class="space-main-wrapper">
    
    <div class="space-hud-header">
      <i class="fa-solid fa-atom"></i>
      <h1>نظـام الاستكشاف المداري</h1>
      <p>ابحث وتصفح محتوى النظام عبر ممر الطاقة الأفقي السريع</p>
      <div class="space-counter-tag">
        <i class="fa-solid fa-database"></i> إجمالي الصفحات المتاحة: {{RosTrick_PagesCount}}
      </div>
    </div>

    <!-- صندوق البحث محاط بـ r-search-box كما طلبت -->
    <div class="r-search-box">
      {{RosTrick_SearchBox}}
    </div>

    <!-- قسم النتائج والصفحات الأفقية القابلة للتمرير الجانبي -->
    <div style="display: flex; flex-direction: column; gap: 15px;">
      <div class="section-label">
        <i class="fa-solid fa-angles-left"></i> قائمة الصفحات (مرّر يميناً ويساراً للتصفح):
      </div>
      {{RosTrick_PagesList}}
    </div>

  </div>

  <!-- سكربت Three.js لتوليد خلفية الفضاء العميق ثلاثية الأبعاد -->
  <script>
    const container = document.getElementById('space-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x010409, 0.0012);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // إنشاء حقل نجوم ثلاثي الأبعاد ديناميكي
    const starsCount = 2200;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(starsCount * 3);

    for (let i = 0; i < starsCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 350;
      positions[i + 1] = (Math.random() - 0.5) * 350;
      positions[i + 2] = (Math.random() - 0.5) * 350;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({
      color: 0x00f2fe,
      size: 0.75,
      transparent: true,
      opacity: 0.9
    });

    const starField = new THREE.Points(geometry, material);
    scene.add(starField);

    // حلقة الحركة المستمرة لعالم الفضاء (تتحرك ببطء باستمرار)
    function animate() {
      requestAnimationFrame(animate);

      starField.rotation.y += 0.00025;
      starField.rotation.x += 0.0001;

      renderer.render(scene, camera);
    }

    animate();

    // التجاوب التلقائي مع شاشة المستخدم
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

<script id="sm-search-placeholders">
(function(){
  var SM_FILE = "searchbyrostrick.html";
  var SM_USER = "BLOXMAM";
  var SM_REPO = "webv";
  function esc(s){ return String(s==null?"":s).replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function norm(s){
    if(!s) return "";
    return String(s)
      .replace(/[\u0660-\u0669]/g, function(d){ return String(d.charCodeAt(0)-0x0660); })
      .replace(/[\u06F0-\u06F9]/g, function(d){ return String(d.charCodeAt(0)-0x06F0); })
      .replace(/[\u064B-\u0652\u0670]/g, "")
      .replace(/[إأآا]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي")
      .toLowerCase().replace(/[\s\-_.,\/]+/g, "").trim();
  }
  function goTo(file){ if (typeof Android !== "undefined" && Android.openLocalPage) { Android.openLocalPage(file); } else { window.location.href = file; } }
  function itemHtml(p){
    var icon = p.icon || "fa-solid fa-file";
    var title = esc(p.title || String(p.file).replace(/\.html$/i, ""));
    return '<div class="rt-search-item" data-rt-file="' + p.file + '"><i class="' + icon + '"></i><span>' + title + '</span></div>';
  }
  function ready(pages, fetchFailed){
    var html = document.body.innerHTML;
    var used = false;
    var errNote = '<div class="rt-search-empty">تعذر تحميل قائمة الصفحات (order.json). إذا كنت تختبر هذا من داخل نافذة المعاينة بلوحة التحكم فهذا متوقع ولن يعمل هناك — جرّب بعد نشر الصفحة فعلياً على الرابط الحقيقي.</div>';
    if (html.indexOf("{{RosTrick_SearchBox}}") !== -1) {
      used = true;
      html = html.split("{{RosTrick_SearchBox}}").join(
        '<div class="rt-search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="rtSearchInput" placeholder="اكتب اسم الصفحة..." autocomplete="off"></div><div class="rt-search-results" id="rtSearchResults"></div>'
      );
    }
    if (html.indexOf("{{RosTrick_PagesList}}") !== -1) {
      used = true;
      if (fetchFailed) {
        html = html.split("{{RosTrick_PagesList}}").join('<div class="rt-pages-list">' + errNote + '</div>');
      } else {
        var listable = pages.filter(function(p){ return p.searchEnabled !== false && p.file !== SM_FILE && !p.hidden; });
        html = html.split("{{RosTrick_PagesList}}").join('<div class="rt-pages-list">' + (listable.length ? listable.map(itemHtml).join("") : '<div class="rt-search-empty">لا توجد صفحات قابلة للظهور بالبحث بعد (فعّلها من قسم \"ترتيب الصفحات\")</div>') + '</div>');
      }
    }
    if (html.indexOf("{{RosTrick_PagesCount}}") !== -1) {
      used = true;
      var countable = fetchFailed ? 0 : pages.filter(function(p){ return p.searchEnabled !== false && p.file !== SM_FILE; }).length;
      html = html.split("{{RosTrick_PagesCount}}").join(String(countable));
    }
    if (used) document.body.innerHTML = html;
    document.body.addEventListener("click", function(e){
      var item = e.target.closest(".rt-search-item");
      if (item && item.getAttribute("data-rt-file")) goTo(item.getAttribute("data-rt-file"));
    });
    var input = document.getElementById("rtSearchInput");
    var resultsEl = document.getElementById("rtSearchResults");
    if (input && resultsEl) {
      if (fetchFailed) { resultsEl.innerHTML = errNote; input.disabled = true; return; }
      var searchable = pages.filter(function(p){ return p.searchEnabled !== false && p.file !== SM_FILE; });
      function render(list){
        if (!list.length) { resultsEl.innerHTML = '<div class="rt-search-empty">لا توجد نتائج مطابقة</div>'; return; }
        resultsEl.innerHTML = list.map(itemHtml).join("");
      }
      function filter(q){
        var nq = norm(q);
        if (!nq) { render(searchable.filter(function(p){ return !p.hidden; })); return; }
        render(searchable.filter(function(p){
          var cands = [p.title, String(p.file).replace(/\.html$/i, "")].concat(Array.isArray(p.searchNames) ? p.searchNames : []);
          return cands.some(function(c){ return norm(c).indexOf(nq) !== -1; });
        }));
      }
      input.addEventListener("input", function(e){ filter(e.target.value); });
      filter("");
    }
  }
  async function loadOrderData(){
    let loadedSuccessfully = false;
    let result = [];
    try {
      if (typeof Android !== "undefined" && Android.readLocalFile) {
        const localData = Android.readLocalFile("order.json");
        if (localData && localData.trim() !== "") {
          result = JSON.parse(localData);
          loadedSuccessfully = true;
        }
      }
      if (!loadedSuccessfully) {
        const res = await fetch("order.json");
        if (res.ok) {
          result = await res.json();
          loadedSuccessfully = true;
        } else { throw new Error(); }
      }
    } catch(e) {
      if (!loadedSuccessfully) {
        try {
          const resAlt = await fetch("https://api.github.com/repos/" + SM_USER + "/" + SM_REPO + "/contents/order.json");
          const dataAlt = await resAlt.json();
          const decodedContent = decodeURIComponent(escape(atob(dataAlt.content.replace(/\s/g, ""))));
          result = JSON.parse(decodedContent);
          loadedSuccessfully = true;
        } catch(err) {}
      }
    }
    if (!loadedSuccessfully) throw new Error("order.json load failed");
    return result;
  }
  loadOrderData().then(function(data){
    ready(Array.isArray(data) ? data : [], false);
  }).catch(function(){ ready([], true); });
})();
</script>
<style id="sm-search-placeholders-style">
  .rt-search-box { display:flex; align-items:center; gap:10px; }
  .rt-search-box input { flex:1; border:none; outline:none; background:transparent; font-size:1rem; }
  .rt-search-item { cursor:pointer; }
  .rt-search-empty { opacity:0.6; text-align:center; padding: 16px; }
</style>

</body>
</html>
