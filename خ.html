<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الديناصور 3D المطورة</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b16;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ffff;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            z-index: 10;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            display: none;
            z-index: 20;
            background: rgba(15, 15, 30, 0.9);
            border: 2px solid #ff0055;
            padding: 35px 60px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
        }
        #game-over h1 {
            margin: 0 0 15px 0;
            color: #ff0055;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.8);
        }
        #game-over button {
            background: linear-gradient(45deg, #00ffff, #0077ff);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
        #game-over button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
        }
        #instructions {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #88a;
            font-size: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            z-index: 10;
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <div id="ui">النقاط: <span id="score">0</span></div>
    
    <div id="game-over">
        <h1>اصطدمت بالعائق!</h1>
        <p>النتيجة النهائية: <span id="final-score">0</span></p>
        <button onclick="restartGame()">العب مجدداً</button>
    </div>

    <div id="instructions">اضغط على مسافة (Space) أو انقر بالشاشة للقفز فوق الحواجز</div>

    <!-- استدعاء Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, dino, obstacles = [], trackPieces = [];
        let score = 0;
        let gameRunning = true;
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = 0.018;
        const jumpStrength = 0.35;
        let gameSpeed = 0.35; // سرعة حركة الديناصور والبيئة

        const scoreElement = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreElement = document.getElementById('final-score');

        function init() {
            // 1. المشهد والكاميرا
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x080812);
            scene.fog = new THREE.FogExp2(0x080812, 0.025);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.5, 7);
            camera.lookAt(0, 1, -2);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // 2. الإضاءة السينمائية
            const ambientLight = new THREE.AmbientLight(0x222244, 1.5);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0x00ffff, 2);
            sunLight.position.set(10, 20, 10);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            const pointLight = new THREE.PointLight(0xff0055, 3, 20);
            pointLight.position.set(-5, 5, -5);
            scene.add(pointLight);

            // 3. بناء الأرضية المتحركة (مرئيات أفضل)
            createTrack();

            // 4. بناء الديناصور المحسن
            createDino();

            // 5. الأحداث
            window.addEventListener('keydown', handleInput);
            window.addEventListener('click', handleInput);
            window.addEventListener('resize', onWindowResize);

            // توليد العائق الأول
            spawnObstacle();

            // حلقة اللعبة
            animate();
        }

        function createTrack() {
            // قطع أرضية تتجدد باستمرار لتشمل إيحاء الحركة الحقيقية
            for (let i = -5; i <= 15; i++) {
                const trackGeo = new THREE.BoxGeometry(6, 0.2, 10);
                const trackMat = new THREE.MeshStandardMaterial({ 
                    color: i % 2 === 0 ? 0x121225 : 0x181830,
                    roughness: 0.5,
                    metalness: 0.2
                });
                const track = new THREE.Mesh(trackGeo, trackMat);
                track.position.set(0, -0.1, i * 10 - 20);
                track.receiveShadow = true;
                scene.add(track);
                trackPieces.push(track);
            }
        }

        function updateTrack() {
            trackPieces.forEach(track => {
                track.position.z += gameSpeed;
                // إذا قطعت القطعة المسافة للخلف، أعد تدويرها للأمام لتبدو كأن الطريق لا ينتهي
                if (track.position.z > 25) {
                    track.position.z -= 200;
                }
            });
        }

        function createDino() {
            dino = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.3, metalness: 0.4 });
            const accentMat = new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.2 });

            // الجسم الرئيسي
            const bodyGeo = new THREE.BoxGeometry(0.7, 0.7, 1.1);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            body.castShadow = true;
            dino.add(body);

            // الرأس
            const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.7);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.set(0, 1.3, 0.5);
            head.castShadow = true;
            dino.add(head);

            // العينين (توهج)
            const eyeGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const eye = new THREE.Mesh(eyeGeo, accentMat);
            eye.position.set(0.25, 1.4, 0.8);
            dino.add(eye);

            // الظهر (أشواك جمالية)
            for (let i = -0.3; i <= 0.4; i += 0.3) {
                const spikeGeo = new THREE.ConeGeometry(0.15, 0.3, 4);
                const spike = new THREE.Mesh(spikeGeo, accentMat);
                spike.position.set(0, 1.3, i);
                dino.add(spike);
            }

            // الأرجل
            const legGeo = new THREE.BoxGeometry(0.2, 0.5, 0.25);
            const leg1 = new THREE.Mesh(legGeo, bodyMat);
            leg1.position.set(-0.2, 0.25, 0.2);
            dino.add(leg1);

            const leg2 = new THREE.Mesh(legGeo, bodyMat);
            leg2.position.set(0.2, 0.25, 0.2);
            dino.add(leg2);

            dino.position.set(0, 0, 0);
            scene.add(dino);
        }

        function spawnObstacle() {
            if (!gameRunning) return;

            const height = Math.random() * 0.7 + 0.5;
            const width = Math.random() * 0.6 + 0.6;
            const obsGeo = new THREE.BoxGeometry(width, height, 0.6);
            const obsMat = new THREE.MeshStandardMaterial({ 
                color: 0xff0055, 
                roughness: 0.2,
                emissive: 0x330011
            });
            const obstacle = new THREE.Mesh(obsGeo, obsMat);

            // العوائق تأتي من العمق (البعيد) نحو الكاميرا/الديناصور
            obstacle.position.set(0, height / 2, -60);
            obstacle.castShadow = true;
            scene.add(obstacle);
            obstacles.push(obstacle);

            // وقت ظهور العائق القادم يتناسب مع السرعة
            const nextSpawnTime = Math.random() * 1200 + 1000;
            setTimeout(spawnObstacle, nextSpawnTime);
        }

        function handleInput(e) {
            if (e.code === 'Space' || e.type === 'click') {
                if (!gameRunning) return;
                if (!isJumping) {
                    isJumping = true;
                    jumpVelocity = jumpStrength;
                }
            }
        }

        function updateDino() {
            if (isJumping) {
                dino.position.y += jumpVelocity;
                jumpVelocity -= gravity;

                // ميلان خفيف أثناء القفز لإعطاء حيوية
                dino.rotation.x = -jumpVelocity * 0.5;

                if (dino.position.y <= 0) {
                    dino.position.y = 0;
                    isJumping = false;
                    jumpVelocity = 0;
                    dino.rotation.x = 0;
                }
            } else {
                // تأثير اهتزاز بسيط للجري الحقيقي على الأرض
                dino.position.y = Math.sin(Date.now() * 0.02) * 0.03;
            }
        }

        function updateObstacles() {
            for (let i = obstacles.length - 1; i >= 0; i--) {
                // العوائق تتحرك للأمام نحو اللاعب
                obstacles[i].position.z += gameSpeed;
                obstacles[i].rotation.y += 0.01;

                // فحص الاصطدام بدقة
                const dinoBox = new THREE.Box3().setFromObject(dino);
                const obsBox = new THREE.Box3().setFromObject(obstacles[i]);

                if (dinoBox.intersectsBox(obsBox)) {
                    gameOver();
                }

                // إذا تجاوز العائق اللاعب
                if (obstacles[i].position.z > 5) {
                    scene.remove(obstacles[i]);
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreElement.innerText = score;

                    // زيادة طفيفة بالسرعة مع التقدم
                    gameSpeed = 0.35 + Math.floor(score / 150) * 0.03;
                }
            }
        }

        function gameOver() {
            gameRunning = false;
            gameOverScreen.style.display = 'block';
            finalScoreElement.innerText = score;
        }

        function restartGame() {
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
            score = 0;
            gameSpeed = 0.35;
            scoreElement.innerText = score;
            dino.position.y = 0;
            isJumping = false;
            gameOverScreen.style.display = 'none';
            gameRunning = true;
            setTimeout(spawnObstacle, 1500);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameRunning) {
                updateTrack();
                updateDino();
                updateObstacles();
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
