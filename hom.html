<script>
const DB='https://clean-sequencer-422716-g8-default-rtdb.firebaseio.com',KEY='';
const $=s=>document.querySelector(s),h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){const v=a[k];if(v==null||v===false)continue;k.startsWith('on')?e[k]=v:k=='class'?e.className=v:e.setAttribute(k,v===true?'':v)}c.flat().forEach(x=>e.append(x?.nodeType?x:(x??'')));return e};
const api=async(m,p,b)=>{const r=await fetch(DB+'/'+p+'.json'+(KEY?'?auth='+KEY:''),{method:m,body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw 0;return r.json()};
const get=p=>api('GET',p),put=(p,b)=>api('PUT',p,b),del=p=>api('DELETE',p),patch=(p,b)=>api('PATCH',p,b);
let _tt;const toast=m=>{const t=$('#tt');t.textContent=m;t.style.display='block';clearTimeout(_tt);_tt=setTimeout(()=>t.style.display='none',2800)};
const dlg=(...c)=>{const d=h('dialog',{},...c);d.onclose=()=>d.remove();document.body.append(d);d.showModal();return d};
const closeBtn=()=>h('button',{class:'g',onclick:e=>e.target.closest('dialog').close()},'إغلاق');
document.documentElement.dataset.t=localStorage.sg_theme||'night';
const tth=()=>{const d=document.documentElement;d.dataset.t=localStorage.sg_theme=d.dataset.t=='day'?'night':'day'};

const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const me=()=>JSON.parse(localStorage.sg_user||'null');
const dl=(n,t)=>{const a=h('a',{href:URL.createObjectURL(new Blob([t],{type:'application/json'})),download:n});document.body.append(a);a.click();a.remove()};
async function login(name,acc,pw){const id=acc.trim().toLowerCase().replace(/[.#$\[\]\/\s]/g,'_');if(!id||!pw||!name)throw'أكمل جميع الحقول';const u=await get('users/'+id);let nm=name;if(!u){const salt=crypto.randomUUID();await put('users/'+id,{name,acc,salt,hash:await sha(salt+pw),created:Date.now()})}else{if(u.hash!==await sha(u.salt+pw))throw'كلمة المرور غير صحيحة';nm=u.name}localStorage.sg_user=JSON.stringify({id,name:nm})}
function authDlg(cb){const n=h('input',{placeholder:'إسمك، مثل: محمد'}),a=h('input',{placeholder:'إسم المستخدم مثل: @sad'}),p=h('input',{type:'password',placeholder:'كلمة المرور'}),er=h('small',{class:'mu'});const d=dlg(h('h3',{},'تسجيل الدخول'),h('p',{class:'mu'},'إن لم يكن الحساب موجودًا فسيُنشأ تلقائيًا.'),n,a,p,er,h('div',{class:'row'},h('button',{onclick:async()=>{try{await login(n.value.trim(),a.value,p.value);d.close();cb()}catch(e){er.textContent=typeof e=='string'?e:'تعذّر الاتصال'}}},'دخول'),closeBtn()))}
async function nots(){const u=me();let a={},b={};try{a=await get('notifs/'+u.id)||{};b=await get('notifs/_all')||{}}catch(e){}return[...Object.values(a),...Object.values(b)].sort((x,y)=>y.d-x.d)}
async function bell(){if(!me())return authDlg(()=>location.reload());const l=await nots();localStorage['sg_seen_'+me().id]=Date.now();$('#bl').textContent='🔔';dlg(h('h3',{},'الإشعارات'),...(l.length?l.map(n=>h('div',{class:'card'},n.m,h('div',{},h('small',{class:'mu'},new Date(n.d).toLocaleDateString('ar'))))):[h('p',{class:'mu'},'لا توجد إشعارات')]),closeBtn())}
function bar(){const u=me();$('#who').textContent=u?'أهلًا '+u.name:'تتصفح كزائر';const b=$('#lg');b.textContent=u?'خروج':'دخول';b.onclick=()=>u?(localStorage.removeItem('sg_user'),location.reload()):authDlg(()=>location.reload());$('#bl').style.display=u?'':'none';if(u)nots().then(l=>{const n=l.filter(x=>x.d>(+localStorage['sg_seen_'+u.id]||0)).length;if(n)$('#bl').textContent='🔔 '+n})}

let SORT='new',LIST={},U,S,P,GM,V0={},pre=0,T=[],cm='',au=new Audio(),sx=new Audio(),fs=+localStorage.sg_fs||1,vol=localStorage.sg_vol==null?.5:+localStorage.sg_vol,mute=localStorage.sg_mute=='1';
const hue=t=>[...t].reduce((s,c)=>s+c.charCodeAt(0),0)%360;
const cover=x=>x.cover?`url("${x.cover.replace(/["\\]/g,'')}")`:`linear-gradient(160deg,hsl(${hue(x.title)} 38% 26%),hsl(${(hue(x.title)+50)%360} 45% 12%))`;
const heart=g=>(g.liked?'♥ ':'♡ ')+(g.likes||0);
async function load(){try{const a=await get('games')||{},l=await get('likes')||{},u=me();LIST={};for(const k in a)if(a[k].status=='approved')LIST[k]={...a[k],id:k,likes:Object.keys(l[k]||{}).length,liked:!!(u&&l[k]&&l[k][u.id])};localStorage.sg_list=JSON.stringify(LIST)}catch(e){LIST=JSON.parse(localStorage.sg_list||'{}');toast('وضع بدون اتصال')}draw()}
function draw(){const so=$('#so');so.innerHTML='';[['new','الأحدث'],['likes','الأكثر إعجابًا']].forEach(([k,l])=>so.append(h('button',{class:'g s'+(SORT==k?' on':''),onclick:()=>{SORT=k;draw()}},l)));const g=$('#gr'),q=($('#q').value||'').trim();g.innerHTML='';const a=Object.values(LIST).filter(x=>!q||((x.title||'')+(x.desc||'')+(x.ownerName||'')).includes(q)).sort((x,y)=>SORT=='likes'?y.likes-x.likes:y.updated-x.updated);if(!a.length)g.append(h('p',{class:'mu'},q?'لا نتائج مطابقة.':'لا توجد روايات منشورة بعد.'));
a.forEach(x=>{const lb=h('button',{class:'g'},heart(x));lb.onclick=()=>lk(x,lb);g.append(h('article',{class:'it'},h('div',{class:'tl',tabindex:0,role:'button',onclick:()=>openOv(x.id),onkeydown:e=>e.key=='Enter'&&openOv(x.id),style:'background-image:'+cover(x)},x.part>1?h('span',{class:'pt'},'الجزء '+x.part+(LIST[x.prev]?' من '+LIST[x.prev].title:'')):'',h('h3',{},x.title),h('p',{},(x.desc||'').slice(0,90))),h('div',{class:'row'},h('button',{onclick:()=>openOv(x.id)},'اقرأ'),lb,h('button',{class:'g',onclick:()=>cmts(x)},'💬'))))})}
async function lk(g,b){const u=me();if(!u)return authDlg(()=>{bar();lk(g,b)});if(g.id=='preview')return;try{const l=await get('likes/'+g.id+'/'+u.id);l?await del('likes/'+g.id+'/'+u.id):await put('likes/'+g.id+'/'+u.id,true);g.liked=!l;g.likes=Math.max(0,(g.likes||0)+(l?-1:1));if(LIST[g.id]&&LIST[g.id]!==g){LIST[g.id].likes=g.likes;LIST[g.id].liked=g.liked}document.querySelectorAll('[data-lk="'+g.id+'"]').forEach(x=>x.textContent=heart(g));if(b)b.textContent=heart(g);toast(l?'أُزيل الإعجاب':'أعجبتك الرواية ♥')}catch(e){toast('لا اتصال')}}
async function cmts(g){if(g.id=='preview')return toast('التعليقات غير متاحة في المعاينة');const box=h('div'),ta=h('textarea',{placeholder:'اكتب تعليقك…',maxlength:500});
const dr=async()=>{box.innerHTML='';let c={};try{c=await get('comments/'+g.id)||{}}catch(e){box.append(h('p',{class:'mu'},'لا اتصال'));return}
const ks=Object.keys(c).sort((a,b)=>c[b].d-c[a].d);if(!ks.length)box.append(h('p',{class:'mu'},'كن أول من يعلّق'));
ks.forEach(i=>{const x=c[i],u=me(),mine=u&&x.u==u.id,cd=h('div',{class:'card sub'});
const view=()=>{cd.innerHTML='';cd.append(h('div',{class:'row'},h('b',{},x.n),h('small',{class:'mu'},new Date(x.d).toLocaleDateString('ar')+(x.ed?' · معدّل':'')),h('span',{class:'sp'}),mine?h('button',{class:'g s',onclick:edit},'تعديل'):'',mine?h('button',{class:'g s',onclick:rmv},'حذف'):''),h('p',{class:'ct'},x.t))};
const edit=()=>{const e=h('textarea',{maxlength:500},x.t);cd.innerHTML='';cd.append(e,h('div',{class:'row'},h('button',{onclick:async()=>{const v=e.value.trim();if(!v)return toast('التعليق فارغ');try{const n={...x,t:v,ed:Date.now()};await put('comments/'+g.id+'/'+i,n);Object.assign(x,n);view();toast('تم التعديل')}catch(_){toast('تعذّر الحفظ')}}},'حفظ'),h('button',{class:'g',onclick:view},'إلغاء')))};
