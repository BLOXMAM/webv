<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة المنزّلة</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#022c22;color:#ecfdf5;font-size:16px;line-height:1.7}
  header{padding:22px 16px;text-align:center;background:linear-gradient(135deg,#065f46,#10b981)}
  header h1{margin:0;font-size:21px}
  header p{margin:4px 0 0;font-size:14px;opacity:.9}
  main{padding:16px;max-width:600px;margin:0 auto}
  .card{background:#064e3b;border:1px solid #047857;border-radius:16px;padding:18px;margin-bottom:14px;text-align:center}
  .num{font-size:52px;font-weight:800;margin:6px 0}
  button{width:100%;padding:15px;border:0;border-radius:12px;font-size:17px;font-weight:700;color:#064e3b;background:#fff;cursor:pointer}
  button.gray{background:#334155;color:#fff;margin-top:10px}
  button:active{transform:scale(.98)}
  .info{font-size:14px;color:#a7f3d0}
  .pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;margin:4px 2px}
  .on{background:#16a34a}.off{background:#dc2626}
</style>
</head>
<body>
<header>
  <h1>✅ الصفحة الثانية (المنزّلة)</h1>
  <p>إذا فُتحت هذه الصفحة فالتنزيل نجح</p>
</header>

<main>
  <div class="card">
    <div class="info">عدّاد تجريبي للتأكد من عمل السكربت</div>
    <div class="num" id="count">0</div>
    <button id="plus">اضغط للعدّ</button>
  </div>

  <div class="card">
    <div id="net" class="pill">…</div>
    <div id="env" class="pill" style="background:#7c3aed">…</div>
    <div class="info" style="margin-top:8px" id="time"></div>
  </div>

  <button class="gray" id="back">↩️ رجوع للصفحة الأولى</button>
</main>

<script>
(function () {
  var n = 0, c = document.getElementById('count');
  document.getElementById('plus').onclick = function(){ c.textContent = ++n; };

  document.getElementById('time').textContent =
    'وقت فتح الصفحة: ' + new Date().toLocaleTimeString('ar-SA');

  var net = document.getElementById('net');
  function updNet(){
    var on = navigator.onLine;
    net.textContent = on ? '🌐 متصل بالإنترنت' : '✈️ بلا إنترنت (تعمل من الجهاز)';
    net.className = 'pill ' + (on ? 'on' : 'off');
  }
  updNet();
  addEventListener('online', updNet);
  addEventListener('offline', updNet);

  var env = document.getElementById('env');
  env.textContent = window.RosTrickPages ? '📱 داخل تطبيق RosTrick' : '🖥️ متصفح عادي';

  document.getElementById('back').onclick = function(){
    if (history.length > 1) history.back();
    else if (window.RosTrickPages) { try { window.RosTrickPages.openPage('home-test.html'); } catch(e){} }
    else location.href = 'home-test.html';
  };
})();
</script>
</body>
</html>
