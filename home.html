<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070f">
<title>الظل 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--cy:#38e1ff;--yl:#ffd34e;--bg:#05070f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;color:#eaf6ff;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;overflow:hidden}
#art{position:absolute;inset:0;width:100%;height:100%}
#shade{position:absolute;inset:0;background:linear-gradient(270deg,rgba(5,7,15,.92) 0%,rgba(5,7,15,.82) 28%,rgba(5,7,15,.25) 52%,rgba(5,7,15,0) 70%),radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
#panel{position:absolute;top:0;bottom:0;right:0;width:min(46%,560px);display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,2.2vh,16px);padding:0 max(5vw,env(safe-area-inset-right)) 0 2vw}
#tag{font-size:clamp(11px,2.6vh,15px);letter-spacing:.22em;color:var(--cy);font-weight:800;text-shadow:0 0 14px rgba(56,225,255,.6)}
h1{font-size:clamp(46px,17vh,120px);font-weight:900;line-height:1;color:#fff;text-shadow:0 0 28px rgba(56,225,255,.55),0 4px 0 #0a1230}
h1 small{font-size:.42em;color:var(--cy);margin-inline-start:.2em;font-weight:900;letter-spacing:.04em}
#sub{font-size:clamp(12px,3.2vh,19px);line-height:1.7;color:#b9c9e6;font-weight:600;max-width:30em}
#go{margin-top:clamp(4px,1.6vh,12px);align-self:flex-start;appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:clamp(16px,4.4vh,26px);padding:.55em 1.9em;border-radius:999px;color:#04101a;background:linear-gradient(180deg,#8ff3ff,#38e1ff);box-shadow:0 0 0 2px rgba(255,255,255,.25) inset,0 8px 30px rgba(56,225,255,.45);transition:transform .15s,opacity .3s,filter .3s;opacity:.35;pointer-events:none;filter:grayscale(.6)}
#go.on{opacity:1;pointer-events:auto;filter:none;animation:bob 2.2s ease-in-out infinite}
#go:active{transform:scale(.96)}
#bar{width:min(100%,340px);height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yl),var(--cy));box-shadow:0 0 12px var(--cy);transition:width .25s}
#st{font-size:clamp(10px,2.4vh,14px);color:#7f93b5;font-weight:600}
#foot{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));right:max(5vw,env(safe-area-inset-right));font-size:clamp(9px,2.2vh,12px);color:#6f82a6;font-weight:600;letter-spacing:.04em}
#rot{position:fixed;inset:0;z-index:50;background:rgba(5,7,15,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
#rot .ph{width:64px;height:110px;border:4px solid var(--cy);border-radius:14px;box-shadow:0 0 22px rgba(56,225,255,.5);animation:rot 2.4s ease-in-out infinite}
#rot b{font-size:20px;font-weight:900}#rot span{font-size:14px;color:#9fb2d4}
@media (orientation:portrait){#rot{display:flex}}
.tw{animation:tw 3s ease-in-out infinite}.fl{animation:fl 2.6s steps(2) infinite}.pulse{animation:pl 2.4s ease-in-out infinite}
.hero{animation:fly 4.5s ease-in-out infinite}.eye{animation:pl 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}@keyframes fl{40%{opacity:.1}}@keyframes pl{50%{opacity:.55}}
@keyframes fly{50%{transform:translateY(-12px)}}@keyframes bob{50%{transform:translateY(-3px);box-shadow:0 0 0 2px rgba(255,255,255,.25) inset,0 12px 38px rgba(56,225,255,.6)}}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:60}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

    p=Math.min(100,p+Math.random()*9+3);
    fill.style.width=p+'%';
    if(p>=100){ready=true;st.textContent='جاهز';go.classList.add('on');return}
    st.textContent=p<40?'جارٍ تجهيز المدينة…':p<75?'تشغيل الأضواء…':'تقريباً جاهز…';
    setTimeout(tick,160+Math.random()*140);
  }
  setTimeout(tick,300);
  function enter(){
    if(!ready)return;ready=false;
    try{var l=screen.orientation&&screen.orientation.lock;if(l)screen.orientation.lock('landscape').catch(function(){})}catch(e){}
    try{var el=document.documentElement;if(el.requestFullscreen&&!document.fullscreenElement)el.requestFullscreen().catch(function(){})}catch(e){}
    document.getElementById('fade').style.opacity=1;
    setTimeout(function(){location.href=GAME_URL},550);
  }
  go.addEventListener('click',enter);
  document.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')enter()});
})();
</script>
</body>
</html>
