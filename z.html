  <meta charset="UTF-8">

  <title>تحدي الأسس والأقواس الاحترافي</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 550px;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
      border: 1px solid var(--w2);
      position: relative;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: var(--text);
    }

    p.subtitle {
      text-align: center;
      color: var(--subtext);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text);
    }

    /* أزرار اختيار الأنماط المتقدمة */
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .mode-btn {
      background: var(--w1);
      border: 2px solid transparent;
      color: var(--text);
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      font-size: 0.95rem;
    }

    .mode-btn.active {
      background: var(--primary);
      border-color: var(--primary-dark);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(79, 70, 229, 0.3);
    }

    /* اختيار الجداول/الأسس */
    .tables-container-wrapper {
      transition: all 0.3s ease;
    }

    .tables-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .table-btn {
      background: var(--w1);
      border: 2px solid transparent;
      color: var(--text);
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .table-btn.active {
      background: var(--primary);
      border-color: var(--primary-dark);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(79, 70, 229, 0.3);
    }

    /* اختيار المستوى */
    .levels-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .level-card {
      background: var(--w1);
      border: 2px solid transparent;
      padding: 14px;
      border-radius: 14px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      color: var(--text);
    }

    .level-card h4 { font-size: 1rem; margin-bottom: 4px; }
    .level-card span { font-size: 0.75rem; color: var(--subtext); }

    .level-card.active {
      background: var(--w2);
      border-color: var(--primary);
    }

    .btn-start {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .btn-start:active { transform: scale(0.98); }

    /* منطقة الاختبار */
    .quiz-box { display: none; }

    .header-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: var(--w1);
      color: var(--text);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.9rem;
    }

    .timer-bar-container {
      width: 100%;
      height: 6px;
      background: var(--w1);
      border-radius: 10px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      background: var(--primary);
      width: 100%;
      transition: width 0.1s linear;
    }

    .question-card {
      text-align: center;
      margin-bottom: 28px;
    }

    .question-text {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--text);
      word-break: break-word;
      direction: ltr; /* لضمان ظهور القوس والأسس بالاتجاه الرياضي الصحيح */
      display: inline-block;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .option-btn {
      background: var(--w1);
      border: 2px solid transparent;
      color: var(--text);
      padding: 18px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
      word-break: break-word;
    }

    .option-btn:hover { background: var(--w2); }

    .option-btn.correct {
      background-color: var(--w2) !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
    }

    .option-btn.wrong {
      background-color: var(--w2) !important;
      border-color: var(--danger) !important;
      color: var(--danger) !important;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: -80px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      z-index: 1000;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      pointer-events: none;
    }

    .toast.show {
      bottom: 30px;
      opacity: 1;
    }

    .toast.toast-success { background: var(--success); }
    .toast.toast-error { background: var(--danger); }

    /* الشاشات والنتيجة */
    .result-box { display: none; text-align: center; }
    .result-score { font-size: 3.5rem; font-weight: 900; color: var(--primary); margin: 16px 0; }
    .badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 16px;
      background: var(--w1);
      color: var(--success);
    }
  </style>

<script>
    (function() {
        var SM_SCHEDULE_TARGET_UTC = "2026-08-29T12:02:00.000Z";
        var screenEl = null, countdownEl = null, titleEl = null;
        var syncedServerMs = null, localAnchorMs = null, tickInterval = null;

        function arWord(n, forms) {
            if (n === 1) return forms[0];
            if (n === 2) return forms[1];
            if (n >= 3 && n <= 10) return n + " " + forms[2];
            return n + " " + forms[3];
        }
        var SCH_UNITS = {
            month:  ["شهر", "شهرين", "أشهر", "شهرًا"],
            day:    ["يوم", "يومين", "أيام", "يومًا"],
            hour:   ["ساعة", "ساعتين", "ساعات", "ساعة"],
            minute: ["دقيقة", "دقيقتين", "دقائق", "دقيقة"],
            second: ["ثانية", "ثانيتين", "ثوانٍ", "ثانية"]
        };

        function formatRemaining(totalSeconds) {
            var s = Math.floor(totalSeconds);
            if (s < 0) s = 0;
            var months = Math.floor(s / (30 * 86400)); s -= months * 30 * 86400;
            var days = Math.floor(s / 86400); s -= days * 86400;
            var hours = Math.floor(s / 3600); s -= hours * 3600;
            var minutes = Math.floor(s / 60); s -= minutes * 60;
            var seconds = s;
            var chain = [["month", months], ["day", days], ["hour", hours], ["minute", minutes], ["second", seconds]];
            var firstIdx = -1;
            for (var i = 0; i < chain.length; i++) { if (chain[i][1] > 0) { firstIdx = i; break; } }
            if (firstIdx === -1) return "بقي " + arWord(seconds, SCH_UNITS.second);
            var secondIdx = Math.min(firstIdx + 1, chain.length - 1);
            var part1 = arWord(chain[firstIdx][1], SCH_UNITS[chain[firstIdx][0]]);
            if (secondIdx === firstIdx) return "بقي " + part1;
            var part2 = arWord(chain[secondIdx][1], SCH_UNITS[chain[secondIdx][0]]);
            return "بقي " + part1 + " و" + part2;
        }

        function revealPage() {
            if (tickInterval) clearInterval(tickInterval);
            document.body.classList.remove("schedule-page-is-hidden");
            if (screenEl) screenEl.classList.remove("active");
        }

        function tick() {
            var nowMs = syncedServerMs + (Date.now() - localAnchorMs);
            var targetMs = new Date(SM_SCHEDULE_TARGET_UTC).getTime();
            var remainingSec = (targetMs - nowMs) / 1000;
            if (remainingSec <= 0) { revealPage(); return; }
            if (countdownEl) countdownEl.textContent = formatRemaining(remainingSec);
        }

        function showCountdownScreen() {
            document.body.classList.add("schedule-page-is-hidden");
            if (screenEl) screenEl.classList.add("active");
            if (titleEl) titleEl.textContent = "الصفحة ستفتح قريبًا";
            tick();
            if (tickInterval) clearInterval(tickInterval);
            tickInterval = setInterval(tick, 1000);
        }

        function showErrorScreen() {
            document.body.classList.add("schedule-page-is-hidden");
            if (screenEl) screenEl.classList.add("active");
            if (titleEl) titleEl.textContent = "تعذّر التحقق من الوقت";
            if (countdownEl) {
                countdownEl.innerHTML = "تعذّر مزامنة الوقت مع خادم وقت آمن. لا يمكن فتح الصفحة دون التحقق من الوقت الحقيقي." +
                    '<br><br><button onclick="location.reload()" style="padding:8px 18px;border:none;border-radius:8px;background:#8e44ad;color:#fff;font-weight:bold;cursor:pointer;font-size:0.9rem;">إعادة المحاولة</button>';
            }
        }

        function fetchWithTimeout(url, timeoutMs) {
            return Promise.race([
                fetch(url, { cache: "no-store" }),
                new Promise(function(_, reject) { setTimeout(function() { reject(new Error("timeout")); }, timeoutMs); })
            ]);
        }

        function trySource1() {
            return fetchWithTimeout("https://worldtimeapi.org/api/timezone/Etc/UTC", 6000)
                .then(function(r) { if (!r.ok) throw new Error("http"); return r.json(); })
                .then(function(d) { return new Date(d.utc_datetime).getTime(); });
        }
        function trySource2() {
            return fetchWithTimeout("https://timeapi.io/api/Time/current/zone?timeZone=UTC", 6000)
                .then(function(r) { if (!r.ok) throw new Error("http"); return r.json(); })
                .then(function(d) {
                    var iso = d.dateTime || (d.year + "-" + String(d.month).padStart(2, "0") + "-" + String(d.day).padStart(2, "0") + "T" + String(d.hour).padStart(2, "0") + ":" + String(d.minute).padStart(2, "0") + ":" + String(d.seconds).padStart(2, "0"));
                    if (iso.indexOf("Z") === -1) iso += "Z";
                    return new Date(iso).getTime();
                });
        }
        function trySource3() {
            return fetchWithTimeout("https://cloudflare.com/cdn-cgi/trace", 6000)
                .then(function(r) { if (!r.ok) throw new Error("http"); return r.text(); })
                .then(function(txt) {
                    var m = txt.match(/ts=([0-9.]+)/);
                    if (!m) throw new Error("parse");
                    return parseFloat(m[1]) * 1000;
                });
        }

        function syncTime() {
            return trySource1().catch(trySource2).catch(trySource3);
        }

        function boot() {
            screenEl = document.getElementById("schedule-open-screen");
            countdownEl = document.getElementById("schedule-open-countdown");
            titleEl = document.getElementById("schedule-open-title");
            document.body.classList.add("schedule-page-is-hidden");
            if (screenEl) screenEl.classList.add("active");
            syncTime().then(function(serverMs) {
                syncedServerMs = serverMs;
                localAnchorMs = Date.now();
                var targetMs = new Date(SM_SCHEDULE_TARGET_UTC).getTime();
                if (serverMs >= targetMs) { revealPage(); return; }
                showCountdownScreen();
            }).catch(function() {
                showErrorScreen();
            });
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", boot);
        } else {
            boot();
        }
    })();
<\/script>

<script>
  let currentMode = 'tables'; 
  let selectedPowers = [2, 3];
  let selectedLevel = 'weak';
  let questions = [];
  let currentQuestionIndex = 0;
  let score = 0;
  let timer = null;
  let timePerQuestion = 0;
  let isAnswering = false;

  // تعديل الوقت لجعل النمط المتقدم 10 ثوانٍ كحد أدنى بدلاً من 5 ثوانٍ
  const levelSettings = {
    weak: { count: 5, time: 0 },
    good: { count: 10, time: 25 },
    very_good: { count: 15, time: 15 },
    excellent: { count: 20, time: 10 }
  };

  const superscripts = {
    0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴',
    5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹'
  };

  function toSuperscript(num) {
    return num.toString().split('').map(d => superscripts[d] || d).join('');
  }

  const tablesContainer = document.getElementById('tables-container');
  const availablePowers = [2, 3, 4];
  availablePowers.forEach(p => {
    const btn = document.createElement('button');
    btn.className = `table-btn ${selectedPowers.includes(p) ? 'active' : ''}`;
    btn.innerText = `أس (x${toSuperscript(p)})`;
    btn.onclick = () => togglePower(p, btn);
    tablesContainer.appendChild(btn);
  });

  function setMode(mode, element) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    element.classList.add('active');

    const wrapper = document.getElementById('tables-wrapper');
    if (mode === 'tables') {
      wrapper.style.display = 'block';
    } else {
      wrapper.style.display = 'none';
    }
  }

  function togglePower(num, btn) {
    if (selectedPowers.includes(num)) {
      if (selectedPowers.length > 1) {
        selectedPowers = selectedPowers.filter(t => t !== num);
        btn.classList.remove('active');
      }
    } else {
      selectedPowers.push(num);
      btn.classList.add('active');
    }
  }

  function selectLevel(level, element) {
    selectedLevel = level;
    document.querySelectorAll('.level-card').forEach(el => el.classList.remove('active'));
    element.classList.add('active');
  }

  function showToast(message, type) {
    const toast = document.getElementById('toast');
    toast.innerText = message;
    toast.className = `toast toast-${type} show`;
    setTimeout(() => {
      toast.classList.remove('show');
    }, 1000);
  }

  function generateQuestionData() {
    let text = '', answer = 0;

    if (currentMode === 'tables') {
      const base = Math.floor(Math.random() * 10) + 2; // 2 إلى 11
      const exp = selectedPowers[Math.floor(Math.random() * selectedPowers.length)];
      text = `${base}${toSuperscript(exp)}`;
      answer = Math.pow(base, exp);

    } else if (currentMode === 'brackets_simple') {
      const a = Math.floor(Math.random() * 10) + 1;
      const b = Math.floor(Math.random() * 10) + 1;
      const c = Math.floor(Math.random() * 8) + 2;
      const op = Math.random() > 0.5 ? '+' : '-';

      if (op === '-' && a < b) {
        text = `(${b} - ${a}) × ${c}`;
        answer = (b - a) * c;
      } else {
        text = `(${a} ${op} ${b}) × ${c}`;
        answer = op === '+' ? (a + b) * c : (a - b) * c;
      }

    } else if (currentMode === 'brackets_powers') {
      const a = Math.floor(Math.random() * 6) + 1;
      const b = Math.floor(Math.random() * 6) + 1;
      const exp = Math.random() > 0.3 ? 2 : 3;
      text = `(${a} + ${b})${toSuperscript(exp)}`;
      answer = Math.pow(a + b, exp);

    } else if (currentMode === 'mixed_ops') {
      const base = Math.floor(Math.random() * 6) + 2;
      const exp = 2;
      const b = Math.floor(Math.random() * 8) + 2;
      const c = Math.floor(Math.random() * 5) + 1;
      text = `${base}${toSuperscript(exp)} + (${b} × ${c})`;
      answer = Math.pow(base, exp) + (b * c);

    } else { // random
      const rand = Math.random();
      if (rand < 0.25) {
        const base = Math.floor(Math.random() * 12) + 2;
        const exp = Math.floor(Math.random() * 3) + 2;
        text = `${base}${toSuperscript(exp)}`;
        answer = Math.pow(base, exp);
      } else if (rand < 0.5) {
        const a = Math.floor(Math.random() * 12) + 2;
        const b = Math.floor(Math.random() * 10) + 1;
        const c = Math.floor(Math.random() * 6) + 2;
        text = `(${a} + ${b}) ÷ ${c}`;
        answer = Math.floor((a + b) / c);
        text = `(${a + (c - (a+b)%c)} + ${b}) ÷ ${c}`; // التوافق مع قسمة بدون باقي
        answer = (a + (c - (a+b)%c) + b) / c;
      } else if (rand < 0.75) {
        const a = Math.floor(Math.random() * 5) + 2;
        const b = Math.floor(Math.random() * 5) + 2;
        text = `(${a} × ${b})${toSuperscript(2)}`;
        answer = Math.pow(a * b, 2);
      } else {
        const base = Math.floor(Math.random() * 8) + 2;
        const b = Math.floor(Math.random() * 10) + 5;
        const c = Math.floor(Math.random() * 4) + 1;
        text = `${base}${toSuperscript(2)} + (${b} - ${c})`;
        answer = Math.pow(base, 2) + (b - c);
      }
    }

    return { text, answer };
  }

  function generateQuestions() {
    questions = [];
    const count = levelSettings[selectedLevel].count;

    for (let i = 0; i < count; i++) {
      const { text, answer } = generateQuestionData();

      let options = new Set([answer]);
      while (options.size < 4) {
        let delta = Math.floor(Math.random() * 10) - 5;
        let wrong = answer + (delta === 0 ? 3 : delta);
        if (wrong <= 0 || wrong === answer) {
          wrong = answer + Math.floor(Math.random() * 8) + 1;
        }
        options.add(wrong);
      }

      questions.push({
        text,
        correctAnswer: answer,
        options: Array.from(options).sort(() => Math.random() - 0.5)
      });
    }
  }

  function startQuiz() {
    generateQuestions();
    currentQuestionIndex = 0;
    score = 0;
    timePerQuestion = levelSettings[selectedLevel].time;

    document.getElementById('setup-box').style.display = 'none';
    document.getElementById('result-box').style.display = 'none';
    document.getElementById('quiz-box').style.display = 'block';

    if (timePerQuestion === 0) {
      document.getElementById('timer-container').style.display = 'none';
    } else {
      document.getElementById('timer-container').style.display = 'block';
    }

    showQuestion();
  }

  function showQuestion() {
    clearInterval(timer);
    isAnswering = false;
    const q = questions[currentQuestionIndex];

    document.getElementById('current-q').innerText = currentQuestionIndex + 1;
    document.getElementById('total-q').innerText = questions.length;
    document.getElementById('score-text').innerText = score;
    document.getElementById('question-text').innerText = q.text;

    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt.toLocaleString('ar-EG');
      btn.onclick = () => checkAnswer(opt, btn);
      optionsContainer.appendChild(btn);
    });

    if (timePerQuestion > 0) {
      startTimer();
    }
  }

  function startTimer() {
    const timerBar = document.getElementById('timer-bar');
    timerBar.style.width = '100%';

    const intervalTime = 100;
    const totalSteps = (timePerQuestion * 1000) / intervalTime;
    let currentStep = 0;

    timer = setInterval(() => {
      currentStep++;
      const percentage = 100 - (currentStep / totalSteps) * 100;
      timerBar.style.width = `${Math.max(0, percentage)}%`;

      if (currentStep >= totalSteps) {
        clearInterval(timer);
        checkAnswer(null, null);
      }
    }, intervalTime);
  }

  function checkAnswer(selected, targetBtn) {
    if (isAnswering) return;
    isAnswering = true;
    clearInterval(timer);

    const correct = questions[currentQuestionIndex].correctAnswer;
    const allOptionBtns = document.querySelectorAll('.option-btn');

    if (selected === correct) {
      score++;
      if (targetBtn) targetBtn.classList.add('correct');
      showToast('أحسنت! 👏', 'success');
    } else {
      if (targetBtn) {
        targetBtn.classList.add('wrong');
      }
      allOptionBtns.forEach(btn => {
        if (btn.innerText === correct.toLocaleString('ar-EG')) {
          btn.classList.add('correct');
        }
      });
      showToast('إجابة خاطئة! ❌', 'error');
    }

    setTimeout(() => {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        showQuestion();
      } else {
        endQuiz();
      }
    }, 1200);
  }

  function endQuiz() {
    document.getElementById('quiz-box').style.display = 'none';
    document.getElementById('result-box').style.display = 'block';

    const percentage = Math.round((score / questions.length) * 100);
    document.getElementById('final-percentage').innerText = `${percentage}%`;

    const badge = document.getElementById('level-badge');
    const feedback = document.getElementById('feedback-text');

    if (percentage >= 90) {
      badge.innerText = 'المستوى الفعلي: عبقري العمليات 🌟';
      badge.style.color = 'var(--success)';
      feedback.innerText = 'إنجاز مذهل! إتقان تام لترتيب العمليات والأسس بتركيز عالٍ.';
    } else if (percentage >= 75) {
      badge.innerText = 'المستوى الفعلي: ممتاز 👍';
      badge.style.color = 'var(--primary-dark)';
      feedback.innerText = 'أداء ممتاز! لديك مهارات جيدة جداً في فك الأقواس وتحليل الأسس.';
    } else if (percentage >= 50) {
      badge.innerText = 'المستوى الفعلي: جيد 📈';
      badge.style.color = 'var(--subtext)';
      feedback.innerText = 'نتيجة جيدة! تذكر دائماً أولوية فك ما داخل الأقواس أولاً ثم الأسس.';
    } else {
      badge.innerText = 'المستوى الفعلي: تحتاج للممارسة 💡';
      badge.style.color = 'var(--danger)';
      feedback.innerText = 'لا بأس، العمليات المزدوجة تتطلب تركيزاً. جرب أداء جولة بوقت مفتوح أولاً.';
    }
  }

  function resetQuiz() {
    document.getElementById('result-box').style.display = 'none';
    document.getElementById('setup-box').style.display = 'block';
  }
</script>
