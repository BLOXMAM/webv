<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرياضيات</title>
    <style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#18bc9c,#2c3e50);font-family:'Segoe UI',Tahoma,sans-serif;}
.sm-splash-box{text-align:center;animation:smPulse 1.8s ease-in-out infinite;}
.sm-splash-logo{width:110px;height:110px;object-fit:contain;border-radius:50%;background:#fff;padding:10px;margin-bottom:16px;box-shadow:0 8px 25px rgba(0,0,0,0.25);}
.sm-splash-title{font-size:1.3rem;color:#ffffff;font-weight:bold;}
@keyframes smPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
    </style>
</head>
<body>
<div class="sm-splash-box"><img class="sm-splash-logo" src="https://raw.githubusercontent.com/BLOXMAM/webv/main/app-assets/splash-logo.png" alt="logo"><div class="sm-splash-title">الرياضيات</div></div>
<script>
    setTimeout(function () { window.location.href = "home.html"; }, 2200);
</script>
</body>
</html>
