<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرياضيات</title>
    <style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#121212;font-family:'Segoe UI',Tahoma,sans-serif;}
.sm-splash-box{text-align:center;}
.sm-splash-logo-wrap{position:relative;width:130px;height:130px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;}
.sm-splash-logo{width:80px;height:80px;object-fit:contain;position:relative;z-index:2;}
.sm-splash-ring{position:absolute;inset:0;border:4px solid rgba(24,188,156,0.25);border-top-color:#18bc9c;border-radius:50%;animation:smSpin 1s linear infinite;}
.sm-splash-title{font-size:1.2rem;color:#ecf0f1;font-weight:bold;}
@keyframes smSpin{to{transform:rotate(360deg);}}
    </style>
</head>
<body>
<div class="sm-splash-box"><div class="sm-splash-logo-wrap"><div class="sm-splash-ring"></div><img class="sm-splash-logo" src="https://raw.githubusercontent.com/BLOXMAM/webv/main/app-assets/splash-logo.png" alt="logo"></div><div class="sm-splash-title">الرياضيات</div></div>
<script>
    setTimeout(function () { window.location.href = "home.html"; }, 2200);
</script>
</body>
</html>
