<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرياضيات</title>
    <style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#ffffff;font-family:'Segoe UI',Tahoma,sans-serif;}
.sm-splash-box{text-align:center;animation:smFadeIn 1s ease both;}
.sm-splash-logo{width:120px;height:120px;object-fit:contain;margin-bottom:18px;}
.sm-splash-title{font-size:1.4rem;color:#2c3e50;font-weight:bold;}
@keyframes smFadeIn{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
    </style>
</head>
<body>
<div class="sm-splash-box"><img class="sm-splash-logo" src="https://raw.githubusercontent.com/BLOXMAM/webv/main/app-assets/splash-logo.png" alt="logo"><div class="sm-splash-title">الرياضيات</div></div>
<script>
    setTimeout(function () { window.location.href = "home.html"; }, 2200);
</script>
</body>
</html>
