<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الديناصور 3D - العالم الطبيعي</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            z-index: 10;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            display: none;
            z-index: 20;
            background: rgba(0, 0, 0, 0.85);
            padding: 35px 60px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #game-over h1 { margin: 0 0 15px 0; color: #ff4757; }
        #game-over button {
            background-color: #2ed573;
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        #game-over button:hover { background-color: #26af5f; }
        #instructions {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 16px;
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui">النقاط: <span id="score">0</span></div>
    
    <div id="game-over">
        <h1>لقد خسرت!</h1>
        <p>النتيجة النهائية: <span id="final-score">0</span></p>
        <button onclick="restartGame()">العب مجدداً</button>
    </div>

    <div id="instructions">اضغط على زر المسافة (Space) أو انقر بالشاشة للقفز</div>

    <!-- استدعاء مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, dino, clouds = [], obstacles = [], trackPieces = [];
        let score = 0;
        let gameRunning = true;
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = 0.018;
        const jumpStrength = 0.38;
        let gameSpeed = 0.4;

        const scoreElement = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreElement = document.getElementById('final-score');

        // استخدام Canvas ديناميكي لتوليد خامات (Textures) جاهزة لتجنب مشاكل الروابط الخارجية
        function createSkinTexture(color1, color2) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color1;
            ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = color2;
            for(let i=0; i<100; i++) {
                ctx.fillRect(Math.random()*128, Math.random()*128, 6, 6);
            }
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function init() {
            // 1. المشهد والكاميرا (سماء طبيعية)
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // لون السماء الصافية
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.5, 7);
            camera.lookAt(0, 1, -2);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 2. الإضاءة (شمس طبيعية)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
            sunLight.position.set(20, 30, 20);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // 3. بناء الطريق الطبيعي والعالم
            createTrack();
            createClouds();

            // 4. بناء الديناصور
            createDino();

            // 5. الأحداث
            window.addEventListener('keydown', handleInput);
            window.addEventListener('click', handleInput);
            window.addEventListener('resize', onWindowResize);

            // توليد العوائق
            setTimeout(spawnObstacle, 2000);

            // بدء حلقة اللعبة
            animate();
        }

        function createTrack() {
            for (let i = -5; i <= 15; i++) {
                // الأرضية الجانبية (عشب)
                const grassGeo = new THREE.BoxGeometry(30, 0.1, 10);
                const grassMat = new THREE.MeshStandardMaterial({ color: 0x55a630, roughness: 0.9 });
                const grass = new THREE.Mesh(grassGeo, grassMat);
                grass.position.set(0, -0.15, i * 10 - 20);
                scene.add(grass);

                // مسار الركض في المنتصف (رملي/طيني)
                const trackGeo = new THREE.BoxGeometry(5, 0.2, 10);
                const trackMat = new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.8 });
                const track = new THREE.Mesh(trackGeo, trackMat);
                track.position.set(0, -0.1, i * 10 - 20);
                track.receiveShadow = true;
                scene.add(track);
                trackPieces.push(track);
            }
        }

        function updateTrack() {
            trackPieces.forEach(track => {
                track.position.z += gameSpeed;
                if (track.position.z > 25) {
                    track.position.z -= 200;
                }
            });
        }

        function createClouds() {
            const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
            for(let i=0; i<15; i++) {
                const cloudGroup = new THREE.Group();
                for(let j=0; j<3; j++) {
                    const cloudGeo = new THREE.DodecahedronGeometry(Math.random() * 2 + 1.5);
                    const cloudPart = new THREE.Mesh(cloudGeo, cloudMat);
                    cloudPart.position.set(j * 2 - 2, Math.random() * 0.5, Math.random() * 2);
                    cloudGroup.add(cloudPart);
                }
                cloudGroup.position.set(
                    (Math.random() - 0.5) * 60,
                    Math.random() * 10 + 8,
                    -Math.random() * 100
                );
                scene.add(cloudGroup);
                clouds.push(cloudGroup);
            }
        }

        function updateClouds() {
            clouds.forEach(cloud => {
                cloud.position.z += gameSpeed * 0.2;
                if(cloud.position.z > 20) {
                    cloud.position.z = -100;
                    cloud.position.x = (Math.random() - 0.5) * 60;
                }
            });
        }

        function createDino() {
            dino = new THREE.Group();

            // استخدام ملمس جلدي حرشفي للديناصور
            const skinTex = createSkinTexture('#2b9348', '#55a630');
            const bodyMat = new THREE.MeshStandardMaterial({ map: skinTex, roughness: 0.4 });
            const spikeMat = new THREE.MeshStandardMaterial({ color: 0x38b000, roughness: 0.3 });

            // الجسم
            const bodyGeo = new THREE.BoxGeometry(0.7, 0.7, 1.1);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            body.castShadow = true;
            dino.add(body);

            // الرأس
            const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.7);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.set(0, 1.3, 0.5);
            head.castShadow = true;
            dino.add(head);

            // الظهر (أشواك)
            for (let i = -0.3; i <= 0.4; i += 0.3) {
                const spikeGeo = new THREE.ConeGeometry(0.15, 0.3, 4);
                const spike = new THREE.Mesh(spikeGeo, spikeMat);
                spike.position.set(0, 1.3, i);
                dino.add(spike);
            }

            // الأرجل
            const legGeo = new THREE.BoxGeometry(0.2, 0.5, 0.25);
            const leg1 = new THREE.Mesh(legGeo, bodyMat);
            leg1.position.set(-0.2, 0.25, 0.2);
            dino.add(leg1);

            const leg2 = new THREE.Mesh(legGeo, bodyMat);
            leg2.position.set(0.2, 0.25, 0.2);
            dino.add(leg2);

            dino.position.set(0, 0, 0);
            scene.add(dino);
        }

        function spawnObstacle() {
            if (!gameRunning) return;

            const height = Math.random() * 0.7 + 0.5;
            const width = Math.random() * 0.6 + 0.6;
            const obsGeo = new THREE.BoxGeometry(width, height, 0.6);
            
            // جعل العوائق تبدو كصخور طبيعية خشنة
            const rockTex = createSkinTexture('#6c757d', '#adb5bd');
            const obsMat = new THREE.MeshStandardMaterial({ map: rockTex, roughness: 0.9 });
            
            const obstacle = new THREE.Mesh(obsGeo, obsMat);

            obstacle.position.set(0, height / 2, -60);
            obstacle.castShadow = true;
            scene.add(obstacle);
            obstacles.push(obstacle);

            const nextSpawnTime = Math.random() * 1200 + 1000;
            setTimeout(spawnObstacle, nextSpawnTime);
        }

        function handleInput(e) {
            if (e.code === 'Space' || e.type === 'click') {
                if (!gameRunning) return;
                if (!isJumping) {
                    isJumping = true;
                    jumpVelocity = jumpStrength;
                }
            }
        }

        function updateDino() {
            if (isJumping) {
                dino.position.y += jumpVelocity;
                jumpVelocity -= gravity;
                dino.rotation.x = -jumpVelocity * 0.5;

                if (dino.position.y <= 0) {
                    dino.position.y = 0;
                    isJumping = false;
                    jumpVelocity = 0;
                    dino.rotation.x = 0;
                }
            } else {
                dino.position.y = Math.sin(Date.now() * 0.02) * 0.03;
            }
        }

        function updateObstacles() {
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].position.z += gameSpeed;
                obstacles[i].rotation.y += 0.005;

                const dinoBox = new THREE.Box3().setFromObject(dino);
                const obsBox = new THREE.Box3().setFromObject(obstacles[i]);

                if (dinoBox.intersectsBox(obsBox)) {
                    gameOver();
                }

                if (obstacles[i].position.z > 5) {
                    scene.remove(obstacles[i]);
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreElement.innerText = score;
                    gameSpeed = 0.4 + Math.floor(score / 150) * 0.03;
                }
            }
        }

        function gameOver() {
            gameRunning = false;
            gameOverScreen.style.display = 'block';
            finalScoreElement.innerText = score;
        }

        function restartGame() {
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
            score = 0;
            gameSpeed = 0.4;
            scoreElement.innerText = score;
            dino.position.y = 0;
            isJumping = false;
            gameOverScreen.style.display = 'none';
            gameRunning = true;
            setTimeout(spawnObstacle, 1500);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameRunning) {
                updateTrack();
                updateClouds();
                updateDino();
                updateObstacles();
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
