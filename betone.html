<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة البقرة الراكضة 3D - النسخة المطورة</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            transition: background-color 2s ease;
        }
        #ui {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            z-index: 10;
        }
        .screen-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            display: none;
            z-index: 20;
            background: rgba(0, 0, 0, 0.85);
            padding: 35px 60px;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }
        .screen-box h1 { margin: 0 0 15px 0; }
        .btn {
            background: linear-gradient(135deg, #2ed573, #26af5f);
            border: none;
            color: white;
            padding: 14px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 15px rgba(46, 213, 115, 0.4);
            margin-top: 10px;
        }
        .btn:hover {
            transform: scale(1.08);
            background: linear-gradient(135deg, #26af5f, #1e8e4c);
        }
        #instructions {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 16px;
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui">النقاط: <span id="score">0</span> / 1000</div>
    
    <!-- شاشة الخسارة -->
    <div id="game-over" class="screen-box">
        <h1 style="color: #ff4757;">اصطدمت بالكرة الشوكية!</h1>
        <p>النتيجة النهائية: <span id="final-score">0</span></p>
        <button class="btn" onclick="restartGame()">العب مجدداً</button>
    </div>

    <!-- شاشة الفوز -->
    <div id="win-screen" class="screen-box">
        <h1 style="color: #2ed573;">🎉 مبروووك! فزت باللعبة!</h1>
        <p>لقد وصلت إلى خط النهاية بنجاح وأثبت أن البقرة تستطيع فعل المستحيل!</p>
        <button class="btn" onclick="claimPrize()">خذ جائزتك 🎁</button>
    </div>

    <div id="instructions">اضغط على زر المسافة (Space) أو انقر بالشاشة للقفز فوق الكرات الشوكية</div>

    <!-- استدعاء مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, cow, clouds = [], obstacles = [], trackPieces = [];
        let finishLine = null;
        let stars;
        let score = 0;
        let gameRunning = true;
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = 0.018;
        const jumpStrength = 0.38;
        let gameSpeed = 0.4;
        let hasWon = false;
        let isNight = false;

        const scoreElement = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');
        const winScreen = document.getElementById('win-screen');
        const finalScoreElement = document.getElementById('final-score');

        // مولد ملمس بقر حقيقي (جلد أبيض وبقع سوداء)
        function createCowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = '#111111';
            for(let i = 0; i < 12; i++) {
                ctx.beginPath();
                let x = Math.random() * 256;
                let y = Math.random() * 256;
                let r = Math.random() * 30 + 15;
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        // مولد ملمس الأرضية الخضراء (مع تفاصيل العشب)
        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#55a630';
            ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = '#38b000';
            for(let i=0; i<300; i++) {
                let x = Math.random() * 128;
                let y = Math.random() * 128;
                ctx.fillRect(x, y, 2, 6);
            }
            return new THREE.CanvasTexture(canvas);
        }

        // مولد ملمس الأرضية الترابية مع تشققات واقعية
        function createDirtTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#d4a373';
            ctx.fillRect(0, 0, 128, 128);
            
            ctx.fillStyle = '#bc6c25';
            for(let i=0; i<150; i++) {
                ctx.fillRect(Math.random()*128, Math.random()*128, 4, 4);
            }

            ctx.strokeStyle = '#7f4f24';
            ctx.lineWidth = 1.5;
            for(let i=0; i<4; i++) {
                ctx.beginPath();
                let startX = Math.random() * 128;
                let startY = Math.random() * 128;
                ctx.moveTo(startX, startY);
                ctx.lineTo(startX + (Math.random() * 30 - 15), startY + (Math.random() * 30 - 15));
                ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.5, 7);
            camera.lookAt(0, 1, -2);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
            sunLight.position.set(20, 30, 20);
            sunLight.castShadow = true;
            scene.add(sunLight);

            createTrack();
            createClouds();
            createStars();
            createCow();

            window.addEventListener('keydown', handleInput);
            window.addEventListener('click', handleInput);
            window.addEventListener('resize', onWindowResize);

            setTimeout(spawnObstacle, 2000);
            animate();
        }

        function createTrack() {
            const grassTex = createGrassTexture();
            const dirtTex = createDirtTexture();

            for (let i = -5; i <= 15; i++) {
                const segmentGroup = new THREE.Group();

                // الأرضية الخضراء
                const grassGeo = new THREE.BoxGeometry(30, 0.2, 10);
                const grassMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.9 });
                const grass = new THREE.Mesh(grassGeo, grassMat);
                grass.position.set(0, -0.1, 0);
                grass.receiveShadow = true;
                segmentGroup.add(grass);

                // الأرضية الترابية (بنفس مستوى العشب تماماً لكي تتطابق بسلاسة)
                const trackGeo = new THREE.BoxGeometry(5, 0.22, 10);
                const trackMat = new THREE.MeshStandardMaterial({ map: dirtTex, roughness: 0.8 });
                const track = new THREE.Mesh(trackGeo, trackMat);
                track.position.set(0, -0.09, 0);
                track.receiveShadow = true;
                segmentGroup.add(track);

                segmentGroup.position.set(0, 0, i * 10 - 20);
                scene.add(segmentGroup);
                trackPieces.push(segmentGroup);
            }
        }

        function updateTrack() {
            trackPieces.forEach(segment => {
                segment.position.z += gameSpeed;
                if (segment.position.z > 25) {
                    segment.position.z -= 200;
                }
            });
        }

        function createClouds() {
            const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
            for(let i=0; i<15; i++) {
                const cloudGroup = new THREE.Group();
                for(let j=0; j<3; j++) {
                    const cloudGeo = new THREE.DodecahedronGeometry(Math.random() * 2 + 1.5);
                    const cloudPart = new THREE.Mesh(cloudGeo, cloudMat);
                    cloudPart.position.set(j * 2 - 2, Math.random() * 0.5, Math.random() * 2);
                    cloudGroup.add(cloudPart);
                }
                cloudGroup.position.set(
                    (Math.random() - 0.5) * 60,
                    Math.random() * 10 + 8,
                    -Math.random() * 100
                );
                scene.add(cloudGroup);
                clouds.push(cloudGroup);
            }
        }

        function updateClouds() {
            clouds.forEach(cloud => {
                cloud.position.z += gameSpeed * 0.2;
                if(cloud.position.z > 20) {
                    cloud.position.z = -100;
                    cloud.position.x = (Math.random() - 0.5) * 60;
                }
            });
        }

        function createStars() {
            const starsGeometry = new THREE.BufferGeometry();
            const starsCount = 400;
            const positions = new Float32Array(starsCount * 3);
            const colors = new Float32Array(starsCount * 3);

            for(let i = 0; i < starsCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 200;
                positions[i+1] = Math.random() * 60 + 10;
                positions[i+2] = (Math.random() - 0.5) * 200;

                // تلوين النجوم بين الأبيض والأزرق الفاتح
                if(Math.random() > 0.5) {
                    colors[i] = 1; colors[i+1] = 1; colors[i+2] = 1; // أبيض
                } else {
                    colors[i] = 0.7; colors[i+1] = 0.85; colors[i+2] = 1; // أزرق
                }
            }

            starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starsGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const starsMaterial = new THREE.PointsMaterial({
                size: 0.8,
                vertexColors: true,
                transparent: true,
                opacity: 0 // مخفية في البداية
            });

            stars = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(stars);
        }

        function createCow() {
            cow = new THREE.Group();

            const cowTex = createCowTexture();
            const bodyMat = new THREE.MeshStandardMaterial({ map: cowTex, roughness: 0.4 });
            const pinkMat = new THREE.MeshStandardMaterial({ color: 0xffb5a7, roughness: 0.5 });
            const hornMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.3 });

            const bodyGeo = new THREE.BoxGeometry(0.8, 0.7, 1.3);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.75;
            body.castShadow = true;
            cow.add(body);

            const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.7);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.set(0, 1.1, 0.7);
            head.castShadow = true;
            cow.add(head);

            const snoutGeo = new THREE.BoxGeometry(0.5, 0.25, 0.3);
            const snout = new THREE.Mesh(snoutGeo, pinkMat);
            snout.position.set(0, 0.95, 1.05);
            cow.add(snout);

            const hornGeo = new THREE.ConeGeometry(0.08, 0.3, 4);
            const horn1 = new THREE.Mesh(hornGeo, hornMat);
            horn1.position.set(-0.25, 1.4, 0.6);
            cow.add(horn1);

            const horn2 = new THREE.Mesh(hornGeo, hornMat);
            horn2.position.set(0.25, 1.4, 0.6);
            cow.add(horn2);

            const legGeo = new THREE.BoxGeometry(0.2, 0.5, 0.2);
            for(let x of [-0.25, 0.25]) {
                for(let z of [-0.3, 0.3]) {
                    const leg = new THREE.Mesh(legGeo, bodyMat);
                    leg.position.set(x, 0.25, z);
                    cow.add(leg);
                }
            }

            cow.position.set(0, 0, 0);
            scene.add(cow);
        }

        function spawnObstacle() {
            if (!gameRunning || hasWon) return;
            if (score >= 950) return;

            const obstacle = new THREE.Group();
            
            const coreGeo = new THREE.SphereGeometry(0.4, 8, 8);
            const spikeMat = new THREE.MeshStandardMaterial({ color: 0xff3333, roughness: 0.3, metalness: 0.5 });
            const core = new THREE.Mesh(coreGeo, spikeMat);
            obstacle.add(core);

            for(let i = 0; i < 6; i++) {
                const spikeGeo = new THREE.ConeGeometry(0.12, 0.4, 4);
                const spike = new THREE.Mesh(spikeGeo, spikeMat);
                if(i === 0) spike.position.set(0.4, 0, 0), spike.rotation.z = -Math.PI/2;
                if(i === 1) spike.position.set(-0.4, 0, 0), spike.rotation.z = Math.PI/2;
                if(i === 2) spike.position.set(0, 0.4, 0);
                if(i === 3) spike.position.set(0, -0.4, 0), spike.rotation.x = Math.PI;
                if(i === 4) spike.position.set(0, 0, 0.4), spike.rotation.x = Math.PI/2;
                if(i === 5) spike.position.set(0, 0, -0.4), spike.rotation.x = -Math.PI/2;
                obstacle.add(spike);
            }

            obstacle.position.set(0, 0.5, -60);
            scene.add(obstacle);
            obstacles.push(obstacle);

            const nextSpawnTime = Math.random() * 1200 + 1000;
            setTimeout(spawnObstacle, nextSpawnTime);
        }

        function spawnFinishLine() {
            if (finishLine) return;
            const poleGeo = new THREE.BoxGeometry(0.3, 4, 0.3);
            const flagMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            
            finishLine = new THREE.Group();
            
            const p1 = new THREE.Mesh(poleGeo, flagMat);
            p1.position.set(-2.5, 2, 0);
            const p2 = new THREE.Mesh(poleGeo, flagMat);
            p2.position.set(2.5, 2, 0);
            
            const bannerGeo = new THREE.BoxGeometry(5.2, 1, 0.1);
            const bannerMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const banner = new THREE.Mesh(bannerGeo, bannerMat);
            banner.position.set(0, 3.5, 0);

            finishLine.add(p1);
            finishLine.add(p2);
            finishLine.add(banner);

            finishLine.position.set(0, 0, -60);
            scene.add(finishLine);
        }

        function handleInput(e) {
            if (e.code === 'Space' || e.type === 'click') {
                if (!gameRunning || hasWon) return;
                if (!isJumping) {
                    isJumping = true;
                    jumpVelocity = jumpStrength;
                }
            }
        }

        function updateCow() {
            if (isJumping) {
                cow.position.y += jumpVelocity;
                jumpVelocity -= gravity;
                cow.rotation.x = -jumpVelocity * 0.5;

                if (cow.position.y <= 0) {
                    cow.position.y = 0;
                    isJumping = false;
                    jumpVelocity = 0;
                    cow.rotation.x = 0;
                }
            } else {
                cow.position.y = Math.sin(Date.now() * 0.025) * 0.04;
            }
        }

        function checkNightMode() {
            if (score >= 500 && !isNight) {
                isNight = true;
                // تحويل لون السماء والضباب إلى الليل
                scene.background.setHex(0x0a0a23);
                scene.fog.color.setHex(0x0a0a23);
                document.body.style.backgroundColor = "#0a0a23";
                
                // إظهار النجوم
                stars.material.opacity = 1;

                // تغميق ألوان خامات الأرضية لتناسب الليل
                trackPieces.forEach(segment => {
                    segment.children.forEach(mesh => {
                        mesh.material.color.setHex(0x334433); // جعل العشب داكناً
                    });
                });
            }
        }

        function updateObstacles() {
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].position.z += gameSpeed;
                obstacles[i].rotation.x += 0.03;
                obstacles[i].rotation.y += 0.03;

                const cowBox = new THREE.Box3().setFromObject(cow);
                const obsBox = new THREE.Box3().setFromObject(obstacles[i]);

                if (cowBox.intersectsBox(obsBox)) {
                    gameOver();
                }

                if (obstacles[i].position.z > 5) {
                    scene.remove(obstacles[i]);
                    obstacles.splice(i, 1);
                    
                    if (!hasWon) {
                        score += 10;
                        if (score > 1000) score = 1000;
                        scoreElement.innerText = score;

                        checkNightMode();

                        if (score >= 1000 && !finishLine) {
                            spawnFinishLine();
                        }
                    }
                }
            }

            if (finishLine) {
                finishLine.position.z += gameSpeed;
                if (finishLine.position.z >= 0 && !hasWon) {
                    triggerWin();
                }
            }
        }

        function gameOver() {
            gameRunning = false;
            gameOverScreen.style.display = 'block';
            finalScoreElement.innerText = score;
        }

        function triggerWin() {
            hasWon = true;
            gameRunning = false;
            winScreen.style.display = 'block';
        }

        function claimPrize() {
            alert('مبروك! يتم نقلك الآن إلى صفحة الجائزة...');
            window.location.href = "https://www.google.com"; // استبدلها برابط صفحتك الثانية
        }

        function restartGame() {
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
            if (finishLine) {
                scene.remove(finishLine);
                finishLine = null;
            }
            score = 0;
            hasWon = false;
            isNight = false;
            gameSpeed = 0.4;
            scoreElement.innerText = score;
            cow.position.y = 0;
            isJumping = false;
            scene.background.setHex(0x87CEEB);
            scene.fog.color.setHex(0x87CEEB);
            document.body.style.backgroundColor = "#87CEEB";
            if(stars) stars.material.opacity = 0;

            // إعادة ألوان الأرضية لطبيعتها النهارية
            trackPieces.forEach(segment => {
                segment.children.forEach(mesh => {
                    mesh.material.color.setHex(0xffffff); // إرجاع اللون الطبيعي للخامات
                });
            });

            gameOverScreen.style.display = 'none';
            winScreen.style.display = 'none';
            gameRunning = true;
            setTimeout(spawnObstacle, 1500);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameRunning) {
                updateTrack();
                updateClouds();
                updateCow();
                updateObstacles();
                if(stars && isNight) {
                    stars.rotation.y += 0.0005; // حركة بطيئة للنجوم
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
