<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز التحميل والرفع المتطور</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="url"], input[type="text"] {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="url"]:focus, input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-success {
            background-color: var(--success);
        }
        .btn-success:hover {
            background-color: #059669;
        }

        /* شبكة أزرار التحميل */
        .download-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        /* منطقة الرفع */
        .dropzone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            position: relative;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--primary);
            background-color: rgba(79, 70, 229, 0.05);
        }

        .dropzone input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .dropzone-text {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .dropzone-text span {
            color: var(--primary);
            font-weight: 600;
        }

        /* شريط التقدم */
        .progress-container {
            margin-top: 15px;
            display: none;
        }

        .progress-bar-bg {
            background-color: var(--bg-color);
            border-radius: 8px;
            height: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 8px;
        }

        .progress-bar {
            background-color: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.2s ease;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* قائمة الملفات المرفوعة محلياً */
        .files-list {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
        }

        .file-item {
            background-color: var(--bg-color);
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            border: 1px solid var(--border);
        }

        .file-name {
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 70%;
        }

        .file-size {
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>

<div class="container">

    <!-- قسم التحميل برابط -->
    <div class="card">
        <h2>📥 طرق التحميل من رابط</h2>
        <div class="input-group">
            <input type="url" id="downloadUrl" placeholder="أدخل رابط الملف هنا (مثال: https://example.com/file.zip)" value="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf">
        </div>
        <div class="download-grid">
            <button class="btn" onclick="downloadDirect()">
                <span>🔗 تحميل مباشر (Link)</span>
            </button>
            <button class="btn" onclick="downloadWindowOpen()">
                <span>🪟 فتح في نافذة جديدة</span>
            </button>
            <button class="btn" onclick="downloadFetchBlob()">
                <span>⚡ تحميل عبر Fetch & Blob</span>
            </button>
            <button class="btn btn-success" onclick="simulateAppDownload()">
                <span>📱 محاكاة تحميل التطبيق</span>
            </button>
        </div>
        
        <div class="progress-container" id="downloadProgressContainer">
            <div class="progress-bar-bg">
                <div class="progress-bar" id="downloadProgressBar"></div>
            </div>
            <div class="progress-info">
                <span id="downloadStatusText">جاري التحميل...</span>
                <span id="downloadPercentText">0%</span>
            </div>
        </div>
    </div>

    <!-- قسم الرفع المحلي -->
    <div class="card">
        <h2>📤 قسم الرفع المحلي (برمجياً وشكلياً)</h2>
        
        <!-- الطريقة الأولى: السحب والإفلات -->
        <div class="dropzone" id="dropZone">
            <input type="file" id="fileInput" multiple onchange="handleFilesSelect(this.files)">
            <div class="dropzone-text">
                اسحب الملفات وأفلتها هنا، أو <span>انقر للاختيار</span>
            </div>
        </div>

        <!-- شريط التقدم للرفع -->
        <div class="progress-container" id="uploadProgressContainer" style="display: block;">
            <div class="progress-bar-bg">
                <div class="progress-bar" id="uploadProgressBar" style="width: 0%;"></div>
            </div>
            <div class="progress-info">
                <span id="uploadStatusText">جاهز للرفع المحلي</span>
                <span id="uploadPercentText">0%</span>
            </div>
        </div>

        <!-- قائمة الملفات المضافة محلياً -->
        <div class="files-list" id="filesList">
            <!-- ستظهر الملفات هنا ديناميكياً -->
        </div>
    </div>

</div>

<script>
    // --- 1. طرق التحميل البرمجية ---

    // الطريقة الأولى: الرابط المباشر (Anchor download attribute)
    function downloadDirect() {
        const url = document.getElementById('downloadUrl').value;
        if (!url) return alert('الرجاء إدخال رابط صحيح');
        
        const a = document.createElement('a');
        a.href = url;
        a.download = ''; // محاولة فرض التحميل
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    // الطريقة الثانية: فتح الرابط بنافذة جديدة
    function downloadWindowOpen() {
        const url = document.getElementById('downloadUrl').value;
        if (!url) return alert('الرجاء إدخال رابط صحيح');
        window.open(url, '_blank');
    }

    // الطريقة الثالثة: استخدام Fetch API مع تحويله إلى Blob (مناسب للتحكم المتقدم والتقدم)
    async function downloadFetchBlob() {
        const url = document.getElementById('downloadUrl').value;
        if (!url) return alert('الرجاء إدخال رابط صحيح');

        const container = document.getElementById('downloadProgressContainer');
        const bar = document.getElementById('downloadProgressBar');
        const percentText = document.getElementById('downloadPercentText');
        const statusText = document.getElementById('downloadStatusText');

        container.style.display = 'block';
        statusText.innerText = 'جاري جلب الملف...';
        bar.style.width = '0%';
        percentText.innerText = '0%';

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('فشل الاتصال بالخادم');

            const contentLength = response.headers.get('content-length');
            const total = contentLength ? parseInt(contentLength, 10) : 0;
            let loaded = 0;

            const reader = response.body.getReader();
            const chunks = [];

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                chunks.push(value);
                loaded += value.length;

                if (total) {
                    let percent = Math.round((loaded / total) * 100);
                    bar.style.width = percent + '%';
                    percentText.innerText = percent + '%';
                } else {
                    bar.style.width = '50%';
                    percentText.innerText = 'جاري التحميل...';
                }
            }

            const blob = new Blob(chunks);
            const blobUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = url.split('/').pop() || 'downloaded_file';
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(blobUrl);

            statusText.innerText = 'اكتمل التحميل بنجاح!';
            bar.style.width = '100%';
            percentText.innerText = '100%';
        } catch (error) {
            statusText.innerText = 'حدث خطأ (قد يمنع الكورس-CORS التحميل المباشر للرابط الخارجي)';
            console.error(error);
        }
    }

    // الطريقة الرابعة: محاكاة تحميل مخصص لتطبيقات الويب (Progress Bar وهمي سلس)
    function simulateAppDownload() {
        const container = document.getElementById('downloadProgressContainer');
        const bar = document.getElementById('downloadProgressBar');
        const percentText = document.getElementById('downloadPercentText');
        const statusText = document.getElementById('downloadStatusText');

        container.style.display = 'block';
        statusText.innerText = 'جاري تجهيز الحزمة للتطبيق...';
        
        let progress = 0;
        const interval = setInterval(() => {
            progress += 5;
            bar.style.width = progress + '%';
            percentText.innerText = progress + '%';

            if (progress === 40) statusText.innerText = 'جاري فحص الملفات...';
            if (progress === 80) statusText.innerText = 'جاري الحفظ النهائي...';

            if (progress >= 100) {
                clearInterval(interval);
                statusText.innerText = 'تم التحميل وتجهيز الملف بنجاح!';
            }
        }, 100);
    }


    // --- 2. طرق الرفع المحلي البرمجية والشكلية ---

    const dropZone = document.getElementById('dropZone');
    
    // تأثيرات السحب والإفلات الجمالية
    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
    });
    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
    });

    function handleFilesSelect(files) {
        if (files.length === 0) return;

        const filesListContainer = document.getElementById('filesList');
        const uploadBar = document.getElementById('uploadProgressBar');
        const uploadStatusText = document.getElementById('uploadStatusText');
        const uploadPercentText = document.getElementById('uploadPercentText');

        let progress = 0;
        uploadStatusText.innerText = 'جاري معالجة الملفات محلياً...';

        // محاكاة رفع محلي برمجياً وشكلياً
        const interval = setInterval(() => {
            progress += 10;
            uploadBar.style.width = progress + '%';
            uploadPercentText.innerText = progress + '%';

            if (progress >= 100) {
                clearInterval(interval);
                uploadStatusText.innerText = `تمت إضافة (${files.length}) ملف بنجاح محلياً`;

                // عرض الملفات في القائمة محلياً
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    
                    const sizeKB = (file.size / 1024).toFixed(1);
                    item.innerHTML = `
                        <span class="file-name">📄 ${file.name}</span>
                        <span class="file-size">${sizeKB} KB</span>
                    `;
                    filesListContainer.prepend(item);
                }
            }
        }, 80);
    }
</script>

<script id="admin-scripts">
    const username = "BLOXMAM";
    const repo = "webv";
    const currentFileName = "meow.html";

    function initUserTheme() {
        const toggleBtn = document.getElementById("userThemeToggleBtn");
        const saved = localStorage.getItem("user-theme") || "light";
        if(saved === "dark") {
            document.documentElement.setAttribute("data-user-theme", "dark");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
        } else {
            document.documentElement.removeAttribute("data-user-theme");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
        }
    }

    function toggleUserTheme() {
        const toggleBtn = document.getElementById("userThemeToggleBtn");
        const current = document.documentElement.getAttribute("data-user-theme");
        if(current === "dark") {
            document.documentElement.removeAttribute("data-user-theme");
            localStorage.setItem("user-theme", "light");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
        } else {
            document.documentElement.setAttribute("data-user-theme", "dark");
            localStorage.setItem("user-theme", "dark");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
        }
    }

    function toggleDrawer() {
        const drawer = document.getElementById("drawer");
        const overlay = document.getElementById("drawerOverlay");
        const menuBtn = document.getElementById("menuBtnToggle");
        
        drawer.classList.toggle("open");
        
        if(drawer.classList.contains("open")) {
            overlay.style.display = "block";
            menuBtn.classList.add("active-icon");
        } else {
            overlay.style.display = "none";
            menuBtn.classList.remove("active-icon");
        }
    }

    function renderDrawerContent(orderedPages) {
        const drawerMenu = document.getElementById("drawerDynamicMenu");
        drawerMenu.innerHTML = "";
        const currentPageData = orderedPages.find(p => p.file === currentFileName);
        if (currentPageData && currentPageData.title) {
            document.getElementById("pageMainHeader").innerText = currentPageData.title;
            if(document.getElementById("drawerSideHeader")) document.getElementById("drawerSideHeader").innerText = currentPageData.title;
            if(document.getElementById("pageContentTitle")) document.getElementById("pageContentTitle").innerText = currentPageData.title;
            document.title = currentPageData.title;
        }
        const bottomNavList = document.getElementById("bottomNavbarList");
        if (bottomNavList) bottomNavList.innerHTML = "";
        const goToPage = (file) => {
            if (typeof Android !== "undefined" && Android.openLocalPage) {
                Android.openLocalPage(file);
            } else {
                window.location.href = file;
            }
        };
        orderedPages.forEach(page => {
            if (page.hidden) return;
            const isCurrent = (page.file === currentFileName);
            const li = document.createElement("li");
            li.className = "drawer-item";
            li.innerHTML = "<span>" + page.title + "</span>";
            li.onclick = () => { if (!isCurrent) goToPage(page.file); };
            drawerMenu.appendChild(li);

            if (bottomNavList) {
                const navLi = document.createElement("li");
                navLi.className = "bottom-navbar-item" + (isCurrent ? " active" : "");
                const iconName = page.icon || "fa-solid fa-file";
                navLi.innerHTML = "<i class=\"" + iconName + "\"></i><span>" + page.title + "</span>";
                navLi.onclick = () => { if (!isCurrent) goToPage(page.file); };
                bottomNavList.appendChild(navLi);
            }
        });
        if (bottomNavList) {
            const activeNavItem = bottomNavList.querySelector(".bottom-navbar-item.active");
            if (activeNavItem) {
                setTimeout(() => {
                    activeNavItem.scrollIntoView({ behavior: "auto", inline: "center", block: "nearest" });
                }, 0);
            }
        }
    }

    async function loadGlobalVars() {
        try {
            const res = await fetch("var.json");
            if(res.ok) {
                const data = await res.json();
                const styleEl = document.createElement("style");
                let cssStr = ":root {\n";
                for(let k in data.light) { cssStr += `  ${k}: ${data.light[k]};\n`; }
                cssStr += "}\n[data-user-theme='dark'] {\n";
                for(let k in data.dark) { cssStr += `  ${k}: ${data.dark[k]};\n`; }
                cssStr += "}";
                styleEl.innerHTML = cssStr;
                document.head.appendChild(styleEl);
            }
        } catch(e) { console.log("خطأ في تطبيق المتغيرات العامة"); }
    }

    async function initDrawer() {
        initUserTheme();
        await loadGlobalVars();
        const loader = document.getElementById("drawerLoader");
        let loadedSuccessfully = false;
        try {
            if (typeof Android !== "undefined" && Android.readLocalFile) {
                const localData = Android.readLocalFile("order.json");
                if (localData && localData.trim() !== "") {
                    const orderedPages = JSON.parse(localData);
                    renderDrawerContent(orderedPages);
                    loadedSuccessfully = true;
                }
            }
            if (!loadedSuccessfully) {
                const res = await fetch(`order.json`);
                if (res.ok) {
                    const orderedPages = await res.json();
                    renderDrawerContent(orderedPages);
                    loadedSuccessfully = true;
                } else { throw new Error(); }
            }
        } catch(e) { 
            if (!loadedSuccessfully) {
                try {
                    const resAlt = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/order.json`);
                    const dataAlt = await resAlt.json();
                    const decodedContent = decodeURIComponent(escape(atob(dataAlt.content.replace(/\s/g, ""))));
                    renderDrawerContent(JSON.parse(decodedContent));
                } catch(err) { console.log("خطأ في جلب الهيدر"); }
            }
        } finally {
            if(loader) loader.style.display = "none";
        }
    }
    initDrawer();
</script>
</body>
