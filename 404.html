<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta charset="UTF-8">
    <title>خطأ 404 - الفضاء الرقمي المفقود</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap');

        body, html {
            margin: 0; padding: 0; height: 100%;
            background: #050505;
            color: white;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .container { text-align: center; z-index: 10; }

        /* تأثير رقم 404 الجليتش */
        .error-code {
            font-size: 15rem;
            font-weight: bold;
            margin: 0;
            text-shadow: 2px 2px #ff0055, -2px -2px #00dbde;
            cursor: crosshair;
            transition: 0.3s;
        }

        .error-code:hover {
            letter-spacing: 20px;
            text-shadow: 10px 10px #ff0055, -10px -10px #00dbde;
        }

        h2 { font-size: 2rem; color: #aaa; margin-top: -20px; }

        /* زر الإجراء (Action) */
        .reboot-btn {
            margin-top: 30px;
            padding: 15px 40px;
            background: transparent;
            border: 2px solid #00dbde;
            color: #00dbde;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
        }

        .reboot-btn:hover {
            background: #00dbde;
            color: #050505;
            box-shadow: 0 0 30px #00dbde;
        }

        /* خلفية النجوم المتحركة */
        .stars {
            position: absolute;
            width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            animation: moveStars 200s linear infinite;
            opacity: 0.3;
        }

        @keyframes moveStars { from { background-position: 0 0; } to { background-position: 10000px 5000px; } }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="container">
        <h1 class="error-code" onmouseover="glitch()" id="code">404</h1>
        <h2>يبدو أن هذا الرابط ضاع في الفضاء الرقمي</h2>
        <button class="reboot-btn" onclick="reboot()">إعادة النظام (Reboot)</button>
    </div>

    <script>
        function glitch() {
            let el = document.getElementById('code');
            el.style.transform = "skewX(20deg)";
            setTimeout(() => { el.style.transform = "skewX(0deg)"; }, 200);
        }

        function reboot() {
            alert("جارٍ استعادة البيانات... سيتم تحويلك للصفحة الرئيسية");
            window.location.href = "/"; // قم بتغييرها لرابط موقعك
        }
    </script>
</body>
</html>
