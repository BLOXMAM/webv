<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>الظل 3D – مدينة لا تنام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--cy:#38e1ff;--am:#ffd34e;--bg:#05070d;--u:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#e8eefc;font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;touch-action:none;overscroll-behavior:none}
#stage{position:fixed;left:0;top:0;overflow:hidden;background:var(--bg);touch-action:none}
#stage canvas#gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:0}
#stage canvas#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:1;pointer-events:none}
#vig{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 58%,rgba(0,0,0,.45) 100%)}
button{font-family:inherit;cursor:pointer}
.panel{position:absolute;inset:0;z-index:36;background:rgba(3,5,10,.95);display:none;padding:12px 18px;overflow:auto;touch-action:pan-y}
.panel h2{margin:0 0 6px;color:var(--am);font-size:19px}
.urow{display:flex;align-items:center;gap:10px;padding:7px 10px;margin:5px 0;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(255,255,255,.04)}
.urow b{font-size:14px}.urow small{display:block;opacity:.7;font-size:11.5px}
.urow .pips{margin-inline-start:auto}
.pips{display:flex;gap:4px}.pips i{width:12px;height:12px;border-radius:3px;background:rgba(255,255,255,.18)}.pips i.on{background:var(--cy)}
.srow{display:flex;align-items:center;gap:12px;margin:8px 0;font-size:14px}.srow>span{min-width:120px}.srow input[type=range]{flex:1;max-width:260px}
#vit{position:absolute;left:8px;top:calc(var(--u)*108px);width:calc(var(--u)*100px);font-size:calc(var(--u)*11px);font-weight:800;pointer-events:none;text-shadow:0 0 6px #000;line-height:1.3}
#vit .bar{height:calc(var(--u)*7px);border-radius:5px;background:rgba(255,255,255,.14);margin:2px 0 3px;overflow:hidden;border:1px solid rgba(255,255,255,.22)}
#vit .bar s{display:block;height:100%;width:100%}
#alRow{display:none;color:#ffcf5a}
#alF{background:linear-gradient(90deg,#ffd34e,#ff4d4d)}
.screen{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center;background:radial-gradient(ellipse at 50% 40%,rgba(18,36,76,.28),rgba(3,5,10,.78) 75%)}
.logo{font-size:clamp(44px,15vmin,96px);font-weight:900;line-height:1;color:#fff;text-shadow:0 0 18px rgba(56,225,255,.75),0 0 56px rgba(56,225,255,.35)}
.logo small{display:inline-block;font-size:.3em;letter-spacing:5px;color:var(--cy);margin-inline-start:10px}
.sub{opacity:.85;font-size:clamp(13px,3.4vmin,18px)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.big{min-width:150px;padding:9px 20px;border-radius:12px;border:1.5px solid var(--cy);background:rgba(56,225,255,.12);color:#fff;font-size:clamp(15px,4vmin,19px);font-weight:800;box-shadow:0 0 22px rgba(56,225,255,.25)}
.big.alt{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.06);box-shadow:none;font-size:14px}
.big[disabled]{opacity:.4}
.hint{max-width:min(80%,600px);font-size:11.5px;line-height:1.65;opacity:.7;margin:2px 0 0}
#loadmsg{font-size:13px;color:var(--am);min-height:18px}
#hud{position:absolute;inset:0;z-index:10;pointer-events:none;display:none}
#mini{position:absolute;left:8px;top:8px;width:calc(var(--u)*100px);height:calc(var(--u)*94px);border-radius:10px;border:1px solid rgba(255,255,255,.22);background:#0a0e18}
#obj{position:absolute;left:calc(var(--u)*116px);right:calc(var(--u)*280px);top:8px;height:calc(var(--u)*30px);display:flex;align-items:center;gap:8px;padding:0 10px;font-size:calc(var(--u)*13px);white-space:nowrap;overflow:hidden;background:rgba(8,12,22,.72);border:1px solid rgba(255,211,78,.4);border-radius:9px}
#obj b{color:var(--am);font-size:calc(var(--u)*11px);flex:none}
#objT{overflow:hidden;text-overflow:ellipsis}
#tools{position:absolute;right:8px;top:8px;display:flex;gap:6px;pointer-events:auto;z-index:16}
.hb{width:calc(var(--u)*38px);height:calc(var(--u)*38px);border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(8,12,22,.74);color:#fff;font-size:calc(var(--u)*16px);font-weight:800;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
#btnAuto{border-color:rgba(74,222,128,.6);color:#8dfcb0;font-size:calc(var(--u)*11px)}
#btnAuto.off{border-color:rgba(255,255,255,.25);color:#9aa7c7;opacity:.7}
#btnRot{display:none}
#speed{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;font-size:calc(var(--u)*20px);font-weight:900;text-shadow:0 0 10px #000;display:none;white-space:nowrap}
#speed small{font-size:11px;opacity:.7;margin-inline-start:4px}
#catch{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--u)*86px);width:min(30%,200px);display:none;text-align:center;font-size:12px;font-weight:800;color:#ff8b8b}
#catch i{display:block;height:8px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:2px;border:1px solid rgba(255,90,90,.5)}
#catch i s{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5a5a,#ffb14e)}
#toast{position:absolute;left:50%;top:calc(var(--u)*46px);transform:translateX(-50%);max-width:52%;z-index:22;background:rgba(6,10,20,.86);border:1px solid rgba(56,225,255,.35);border-radius:10px;padding:5px 12px;font-size:calc(var(--u)*13px);line-height:1.5;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
#banner{position:absolute;left:0;right:0;top:26%;z-index:21;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s}
#banner.on{opacity:1}
#banner b{display:block;font-size:clamp(24px,8vmin,44px);font-weight:900;text-shadow:0 0 20px rgba(0,0,0,.9),0 0 30px rgba(56,225,255,.4)}
#banner span{font-size:14px;opacity:.85}
#dlgShield{position:absolute;inset:0;z-index:24;display:none}
#dlg{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;width:min(82%,640px);z-index:25;display:none;background:rgba(6,10,20,.94);border:1px solid rgba(56,225,255,.4);border-radius:14px;padding:8px 14px 18px;pointer-events:none}
#dlgN{font-weight:900;font-size:14px;color:#ffd34e;margin-bottom:2px}
#dlgN.hero{color:var(--cy)}#dlgN.radio{color:#ff9c5a}
#dlgT{font-size:calc(var(--u)*15.5px);line-height:1.65;min-height:44px}
#dlgNext{position:absolute;left:12px;bottom:4px;font-size:11px;opacity:.6}
#stickZone{position:absolute;left:0;bottom:0;width:50%;height:68%;z-index:12;touch-action:none;display:none}
#lookZone{position:absolute;right:0;top:0;width:50%;height:100%;z-index:11;touch-action:none;display:none}
#stickBase{position:absolute;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);z-index:13;display:none;pointer-events:none}
#stickKnob{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:rgba(56,225,255,.35);border:2px solid var(--cy)}
.cb{position:absolute;z-index:14;display:none;align-items:center;justify-content:center;flex-direction:column;border:0;border-radius:50%;padding:0;color:#fff;font-weight:800;touch-action:none;line-height:1.1;background:conic-gradient(var(--c,#ffd34e) var(--p,0deg),rgba(255,255,255,.16) 0)}
.cb::before{content:'';position:absolute;inset:4px;border-radius:50%;background:#0d1322}
.cb.press::before{background:#1c2a4a}
.cb span{position:relative;z-index:1;pointer-events:none;text-align:center}
.cb small{display:block;font-size:calc(var(--u)*10px);font-weight:700;opacity:.9}
#btnAct{right:calc(var(--u)*14px);bottom:calc(var(--u)*14px);width:calc(var(--u)*84px);height:calc(var(--u)*84px);font-size:calc(var(--u)*24px)}
#btnCar{right:calc(var(--u)*108px);bottom:calc(var(--u)*16px);width:calc(var(--u)*62px);height:calc(var(--u)*62px);--c:#9aa7c7;--p:360deg;font-size:calc(var(--u)*19px)}
#btnGas{right:calc(var(--u)*14px);bottom:calc(var(--u)*14px);width:calc(var(--u)*86px);height:calc(var(--u)*86px);--c:#4ade80;--p:360deg;font-size:calc(var(--u)*24px)}
#btnBrake{right:calc(var(--u)*110px);bottom:calc(var(--u)*16px);width:calc(var(--u)*64px);height:calc(var(--u)*64px);--c:#ff6b6b;--p:360deg;font-size:calc(var(--u)*20px)}
#btnNitro{right:calc(var(--u)*22px);bottom:calc(var(--u)*110px);width:calc(var(--u)*56px);height:calc(var(--u)*56px);--c:#38e1ff;font-size:calc(var(--u)*20px)}
body.incar #btnAct{right:calc(var(--u)*94px);bottom:calc(var(--u)*106px);width:calc(var(--u)*58px);height:calc(var(--u)*58px);font-size:calc(var(--u)*18px)}
body.incar #btnCar{right:calc(var(--u)*24px);bottom:calc(var(--u)*174px);width:calc(var(--u)*44px);height:calc(var(--u)*44px);font-size:calc(var(--u)*16px)}
body.gliding #btnBrake{right:calc(var(--u)*14px);bottom:calc(var(--u)*14px);width:calc(var(--u)*86px);height:calc(var(--u)*86px);font-size:calc(var(--u)*24px)}
body.gliding #btnCar{right:calc(var(--u)*190px);bottom:calc(var(--u)*24px);width:calc(var(--u)*56px);height:calc(var(--u)*56px);font-size:calc(var(--u)*16px)}
body.gliding #btnNitro{right:calc(var(--u)*112px);bottom:calc(var(--u)*18px);width:calc(var(--u)*66px);height:calc(var(--u)*66px);--c:#ff9c4e}
#btnL,#btnR{bottom:calc(var(--u)*14px);width:calc(var(--u)*86px);height:calc(var(--u)*86px);--c:#38e1ff;--p:360deg;font-size:calc(var(--u)*34px)}
#btnL{left:calc(var(--u)*16px)}#btnR{left:calc(var(--u)*114px)}
#note{position:absolute;inset:0;z-index:35;background:rgba(3,5,10,.94);display:none;padding:14px 18px;overflow:auto;touch-action:pan-y}
#note h2{margin:0 0 8px;color:var(--am);font-size:20px}
#note ul{padding:0 18px;margin:0;line-height:1.8;font-size:15px}
#note li{margin-bottom:6px}#note li.empty{opacity:.5;list-style:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .7s;z-index:40}
#card{position:absolute;inset:0;z-index:41;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;pointer-events:none}
#card h2{font-size:clamp(24px,8vmin,44px);margin:0;font-weight:900;text-shadow:0 0 22px rgba(56,225,255,.5)}
#card p{margin:0;opacity:.8;max-width:420px;line-height:1.6;font-size:14px}
#card button{pointer-events:auto;margin-top:8px}
#bars i{position:absolute;left:0;right:0;height:0;background:#000;transition:height .8s;z-index:35;pointer-events:none}
#bars i:first-child{top:0}#bars i:last-child{bottom:0}
body.duel #bars i{height:11%}
body.duel #hud,body.duel #btnL,body.duel #btnR,body.duel #btnAct,body.duel #btnCar,body.duel #btnGas,body.duel #btnBrake,body.duel #btnNitro,body.duel #stickZone,body.duel #lookZone,body.duel #btnAuto,body.duel #btnSteer,body.duel #speed,body.duel #toast,body.duel #banner{display:none!important}
#duelUI{position:absolute;top:12%;left:0;right:0;z-index:36;display:none;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#dHearts{font-size:clamp(20px,6vmin,28px);color:#ff4d6a;letter-spacing:4px;text-shadow:0 0 10px rgba(255,77,106,.6)}
#dKing{display:flex;align-items:center;gap:8px;font-size:clamp(11px,3vmin,14px);font-weight:800}
#dKing b{display:block;width:clamp(120px,34vmin,220px);height:8px;border:1px solid #7a0f1a;background:rgba(0,0,0,.6);border-radius:5px;overflow:hidden}
#dKing u{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7a0f1a,#e0394f);transition:width .3s;text-decoration:none}
#sub{position:absolute;left:6%;right:6%;bottom:31%;z-index:36;text-align:center;font-size:clamp(13px,3.8vmin,18px);line-height:1.6;opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:0 2px 8px #000,0 0 3px #000}
#sub.on{opacity:1}#sub b{color:#ffd34e;margin-left:6px}
#qte{position:absolute;inset:0;z-index:37;display:none;touch-action:none}
#qte.on{display:block}
#qIco{position:absolute;width:calc(var(--u)*100px);height:calc(var(--u)*100px);transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(#ffd34e var(--p,360deg),rgba(255,255,255,.14) 0);box-shadow:0 0 30px rgba(255,211,78,.6);display:flex;align-items:center;justify-content:center;animation:qpulse .45s ease-in-out infinite alternate;touch-action:none}
#qIco::before{content:'';position:absolute;inset:-40%;border-radius:50%}
#qIn{position:relative;width:82%;height:82%;border-radius:50%;background:conic-gradient(#38e1ff var(--g,0deg),rgba(8,12,24,.9) 0);display:flex;align-items:center;justify-content:center;pointer-events:none}
#qGl{font-size:calc(var(--u)*40px);color:#fff;text-shadow:0 0 12px #000;pointer-events:none}
#qGl.nleft{animation:nl .5s ease-in-out infinite alternate}#qGl.nright{animation:nr .5s ease-in-out infinite alternate}#qGl.nup{animation:nu .5s ease-in-out infinite alternate}
@keyframes nl{to{transform:translateX(-9px)}}@keyframes nr{to{transform:translateX(9px)}}@keyframes nu{to{transform:translateY(-9px)}}
@keyframes qpulse{to{transform:translate(-50%,-50%) scale(1.09)}}
#qIco.ok{background:#5dff9a;box-shadow:0 0 50px #5dff9a;animation:none;transform:translate(-50%,-50%) scale(1.3);transition:transform .3s,opacity .3s;opacity:.2}
#qIco.bad{background:#ff4d5e;box-shadow:0 0 50px #ff4d5e;animation:none;transform:translate(-50%,-50%) scale(.8);transition:transform .3s,opacity .3s;opacity:.2}
#qLb{position:absolute;transform:translate(-50%,0);font-size:clamp(13px,3.6vmin,17px);font-weight:900;color:#ffd34e;text-shadow:0 2px 8px #000;pointer-events:none;white-space:nowrap}
#credits{position:absolute;inset:0;z-index:60;background:#000;display:none;overflow:hidden;direction:rtl;text-align:center;color:#e8eef5}
#crBox{position:absolute;left:0;right:0;top:100%;padding:0 22px 30vh;display:flex;flex-direction:column;align-items:center;gap:14px}
#credits.run #crBox{animation:crUp 60s linear forwards}
@keyframes crUp{to{transform:translateY(-100%)}}
.crTitle{font-size:clamp(28px,9vmin,52px);font-weight:900;margin:0 0 30px;text-shadow:0 0 26px rgba(56,225,255,.6)}
#crBox h3{margin:26px 0 0;font-size:clamp(14px,4vmin,20px);color:#38e1ff;letter-spacing:1px}
#crBox p{margin:0;opacity:.85;font-size:clamp(13px,3.6vmin,17px);line-height:1.7;max-width:460px}
.crEnd{margin-top:50px;font-size:clamp(22px,6vmin,32px);font-weight:900}
.crEnd small{display:block;margin-top:12px;font-size:clamp(13px,3.6vmin,16px);font-weight:400;opacity:.85;line-height:1.7;max-width:460px}
#crBtns{display:none;flex-direction:column;gap:10px;pointer-events:auto;margin-top:26px;align-items:center}
</style>
</head>
<body>
<div id="stage">
<canvas id="c"></canvas>
<div id="vig"></div>

<div id="title" class="screen">
  <div class="logo">الظل<small>3D</small></div>
  <div class="sub">مدينة لا تنام · تحقيق وعالم مفتوح ثلاثي الأبعاد</div>
  <div class="sub" style="opacity:.55;margin-top:2px;font-size:12px">تم بناؤها داخل RosTrick</div>
  <div class="row"><button id="btnStart" class="big" disabled>لعبة جديدة</button><button id="btnCont" class="big alt" style="display:none">متابعة</button><button id="btnMs" class="big alt" style="display:none">🎯 المهمات</button><button id="btnSet" class="big alt">⚙ الإعدادات</button></div>
  <div id="loadmsg">جارٍ تحميل محرك الرسوميات…</div>
  <div class="row"><button id="btnRotT" class="big alt" style="display:none">🔄 اقلب اتجاه الشاشة</button></div>
</div>

<div id="hud">
  <canvas id="mini" width="130" height="122"></canvas>
  <div id="obj"><b>الهدف</b><span id="objT"></span></div>
  <div id="tools">
    <button id="btnNote" class="hb" aria-label="دفتر الملاحظات">📓</button>
    <button id="btnUpg" class="hb" aria-label="تطوير">🛠</button>
    <button id="btnSet2" class="hb" aria-label="الإعدادات">⚙</button>
    <button id="btnSnd" class="hb" aria-label="الصوت">🔊</button>
    <button id="btnAuto" class="hb off" aria-label="تسارع آلي">آلي</button>
    <button id="btnSteer" class="hb" aria-label="نمط التوجيه">◀▶</button>
    <button id="btnRot" class="hb" aria-label="قلب الشاشة">🔄</button>
  </div>
  <div id="vit"><div id="chipTxt">💾 0/0</div><div class="bar"><s id="hpF"></s></div><div id="alRow">انكشاف<div class="bar"><s id="alF" style="width:0"></s></div></div></div>
  <div id="catch">القبض عليه<i><s id="catchF"></s></i></div>
  <div id="speed"><span id="speedN">0</span><small>كم/س</small></div>
</div>

<div id="toast"></div>
<div id="banner"></div>
<div id="dlgShield"></div>
<div id="dlg"><div id="dlgN"></div><div id="dlgT"></div><div id="dlgNext">اضغط للمتابعة ▾</div></div>

<div id="lookZone"></div>
<div id="stickZone"></div>
<div id="stickBase"><div id="stickKnob"></div></div>
<button id="btnL" class="cb"><span>◀</span></button>
<button id="btnR" class="cb"><span>▶</span></button>
<button id="btnAct" class="cb"><span>—</span></button>
<button id="btnCar" class="cb"><span>🚗<small>ترجّل</small></span></button>
<button id="btnGas" class="cb"><span>🏁<small>تسارع</small></span></button>
<button id="btnBrake" class="cb"><span>🛑<small>فرامل</small></span></button>
<button id="btnNitro" class="cb"><span>⚡<small>نيترو</small></span></button>

<div id="upg" class="panel"><h2>🛠 تطوير القدرات</h2><div id="upgPts" style="font-size:13px;opacity:.85;margin-bottom:4px"></div><div id="upgList"></div><br><button id="upgClose" class="big alt">إغلاق</button></div>
<div id="set" class="panel"><h2>⚙ الإعدادات</h2>
<div class="srow"><span>جودة الرسوميات</span><div class="row"><button id="q0" class="big alt" style="min-width:80px">منخفضة</button><button id="q1" class="big alt" style="min-width:80px">متوسطة</button><button id="q2" class="big alt" style="min-width:80px">عالية</button></div></div>
<div class="srow"><span>حساسية الكاميرا</span><input type="range" id="sCam" min="0.5" max="2" step="0.1"></div>
<div class="srow"><span>المؤثرات</span><input type="range" id="sSfx" min="0" max="1" step="0.05"></div>
<div class="srow"><span>المطر والطقس</span><button id="sRain" class="big alt" style="min-width:90px"></button></div>
<div class="row" style="margin-top:10px"><button id="sSave" class="big alt">💾 احفظ الآن</button><button id="sMenu" class="big alt">⟵ القائمة الرئيسية</button><button id="sClose" class="big">رجوع</button></div></div>
<div id="slots" class="panel"><h2 id="slotsT"></h2><div id="slotList"></div><br><button id="slotsClose" class="big alt">رجوع</button></div>
<div id="missions" class="panel" style="z-index:70"><h2>🎯 المهمات</h2><div id="msList" style="max-height:62vh;overflow:auto"></div><br><button id="msClose" class="big alt">رجوع</button></div>
<div id="note"><h2>📓 دفتر الأدلة</h2><ul id="noteList"></ul><br><button id="noteClose" class="big alt">إغلاق</button></div>
<div id="fade"></div>
<div id="bars"><i></i><i></i></div>
<div id="duelUI"><div id="dHearts"></div><div id="dKing"><span>الملك الأسود</span><b><u id="dKf"></u></b></div></div>
<div id="sub"></div>

let AC=null,eng=null,engG=null,engX=null;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    engG=AC.createGain();engG.gain.value=0;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;
    eng=AC.createOscillator();eng.type='sawtooth';eng.frequency.value=40;
    const eng2=AC.createOscillator();eng2.type='square';eng2.frequency.value=20;
    const g2=AC.createGain();g2.gain.value=.5;
    eng.connect(lp);eng2.connect(g2);g2.connect(lp);lp.connect(engG);engG.connect(AC.destination);eng.start();eng2.start();
    engX={o2:eng2,lp:lp,gear:0,shift:0};
    const tw=AC.createOscillator();tw.type='sine';tw.frequency.value=1500;const twg=AC.createGain();twg.gain.value=0;tw.connect(twg);twg.connect(AC.destination);tw.start();
    engX.tw=tw;engX.twg=twg;
  }catch(e){AC=null}
}
function beep(f,d,type,g,slide){
  if(!AC||!sfxOn)return;
  try{
    const o=AC.createOscillator(),gg=AC.createGain();
    o.type=type||'sine';o.frequency.value=f;
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),AC.currentTime+d);
    gg.gain.value=Math.max(.0003,(g||0.07)*SET.sv);gg.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);
    o.connect(gg);gg.connect(AC.destination);o.start();o.stop(AC.currentTime+d+0.03);
  }catch(e){}
}
const GEARS=[0,.14,.3,.48,.68,.88,2];
function engineSound(on,v,maxV,vol){
  if(!AC||!eng)return;
  vol=vol==null?1:vol;
  try{
    const t=AC.currentTime,sp=clamp(Math.abs(v)/maxV,0,1.5);
    let g=0;while(g<GEARS.length-2&&sp>=GEARS[g+1])g++;
    const f=clamp((sp-GEARS[g])/(GEARS[g+1]-GEARS[g]),0,1),rpm=.22+.78*f;
    if(g!==engX.gear){if(g>engX.gear)engX.shift=.09;engX.gear=g}
    if(engX.shift>0)engX.shift-=.016;
    const gain=on&&sfxOn?(.035+.05*clamp(sp,0,1.2))*vol*(engX.shift>0?.35:1)*SET.sv:0;
    engG.gain.setTargetAtTime(gain,t,.05);
    const fr=30+rpm*(52+g*7);
    eng.frequency.setTargetAtTime(fr,t,.04);engX.o2.frequency.setTargetAtTime(fr*.5,t,.04);
    engX.lp.frequency.setTargetAtTime(240+rpm*520+g*40,t,.06);
    const nit=on&&inCar&&inp.nitro&&car.nitro>2;
    engX.twg.gain.setTargetAtTime(nit&&sfxOn?.012*SET.sv:0,t,.05);
    engX.tw.frequency.setTargetAtTime(1200+sp*1800,t,.1);
  }catch(e){}
}

function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}

  const c=mkCanvas(64,64),g=c.getContext('2d'),gr=g.createRadialGradient(32,32,1,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.3,'rgba(255,255,255,.45)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);

}

function facade(base,lit,seed){
  const c=mkCanvas(256,256),g=c.getContext('2d'),e=mkCanvas(256,256),h=e.getContext('2d'),r=mulberry32(seed);
  g.fillStyle=base;g.fillRect(0,0,256,256);h.fillStyle='#000';h.fillRect(0,0,256,256);
  const cols=['#ffd27a','#ffe9b8','#9fd8ff','#ffb27a'];
  for(let row=0;row<8;row++){
    g.fillStyle='rgba(255,255,255,.05)';g.fillRect(0,row*32+29,256,3);
    for(let k=0;k<8;k++){
      const x=k*32+6,y=row*32+5,on=r()<lit;
      if(on){const col=cols[Math.floor(r()*4)];g.fillStyle=col;g.fillRect(x,y,20,22);h.fillStyle=col;h.fillRect(x,y,20,22)}
      else{g.fillStyle='#0d121c';g.fillRect(x,y,20,22);g.fillStyle='rgba(120,160,220,.14)';g.fillRect(x,y,20,6)}
    }
  }
  const map=new THREE.CanvasTexture(c),em=new THREE.CanvasTexture(e);
  [map,em].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping});
  return {map,em};
}

function boxGeo(w,h,d,r){
  const g=new THREE.BoxGeometry(w,h,d),uv=g.attributes.uv,ou=r(),ov=r(),sz=[d,d,0,0,w,w];
  for(let f=0;f<6;f++){
    if(f===2||f===3)continue;
    for(let k=0;k<4;k++){const i=f*4+k;uv.setXY(i,uv.getX(i)*sz[f]/96+ou,uv.getY(i)*h/224+ov)}
  }
  return g;
}

function obbHit(ax,ay,aa,al,aw,bx,by,ba,bl,bw){
  const dx=bx-ax,dy=by-ay;if(dx*dx+dy*dy>(al+aw+bl+bw)*(al+aw+bl+bw))return false;
  const c1=Math.cos(aa),s1=Math.sin(aa),c2=Math.cos(ba),s2=Math.sin(ba);
  const ax1=[[c1,s1,al],[-s1,c1,aw]],ax2=[[c2,s2,bl],[-s2,c2,bw]];
  for(const A of [ax1[0],ax1[1],ax2[0],ax2[1]]){
    const d=Math.abs(dx*A[0]+dy*A[1]);
    let ra=0,rb=0;
    for(const u of ax1)ra+=u[2]*Math.abs(u[0]*A[0]+u[1]*A[1]);
    for(const u of ax2)rb+=u[2]*Math.abs(u[0]*A[0]+u[1]*A[1]);
    if(d>ra+rb)return false;
  }
  return true;
}

let rnx=0,rny=0;
function resolve(o,r){
  let hit=false;rnx=0;rny=0;
  for(let i=0;i<solids.length;i++){
    const b=solids[i];
    if(o.x<b.x-r||o.x>b.x+b.w+r||o.y<b.y-r||o.y>b.y+b.h+r)continue;
    const cx=clamp(o.x,b.x,b.x+b.w),cy=clamp(o.y,b.y,b.y+b.h),dx=o.x-cx,dy=o.y-cy,d2=dx*dx+dy*dy;
    if(d2>=r*r)continue;
    hit=true;
    if(d2>0.0001){const d=Math.sqrt(d2);o.x=cx+dx/d*r;o.y=cy+dy/d*r;rnx+=dx/d;rny+=dy/d}
    else{
      const l=o.x-b.x,rr=b.x+b.w-o.x,t=o.y-b.y,bt=b.y+b.h-o.y,m=Math.min(l,rr,t,bt);
      if(m===l){o.x=b.x-r;rnx-=1}else if(m===rr){o.x=b.x+b.w+r;rnx+=1}else if(m===t){o.y=b.y-r;rny-=1}else{o.y=b.y+b.h+r;rny+=1}
    }
  }
  const ln=Math.hypot(rnx,rny);if(ln>0){rnx/=ln;rny/=ln}
  return hit;
}

function buildPath(pts,rad){
  {const q=[pts[0]];for(let i=1;i<pts.length;i++){const l=q[q.length-1];if(Math.hypot(pts[i].x-l.x,pts[i].y-l.y)>1.5)q.push(pts[i])}if(q.length<2)q.push({x:q[0].x+1,y:q[0].y});pts=q}
  const out=[{x:pts[0].x,y:pts[0].y}];
  for(let k=1;k<pts.length-1;k++){
    const a=pts[k-1],b=pts[k],c=pts[k+1];
    const l1=Math.hypot(b.x-a.x,b.y-a.y),l2=Math.hypot(c.x-b.x,c.y-b.y);
    const d1={x:(b.x-a.x)/l1,y:(b.y-a.y)/l1},d2={x:(c.x-b.x)/l2,y:(c.y-b.y)/l2};
    const r=Math.min(rad,l1/2,l2/2);
    const p1={x:b.x-d1.x*r,y:b.y-d1.y*r},p2={x:b.x+d2.x*r,y:b.y+d2.y*r};
    out.push(p1);
    for(let t=1;t<8;t++){const u=t/8,v=1-u;out.push({x:v*v*p1.x+2*u*v*b.x+u*u*p2.x,y:v*v*p1.y+2*u*v*b.y+u*u*p2.y})}
    out.push(p2);
  }
  out.push({x:pts[pts.length-1].x,y:pts[pts.length-1].y});
  let s=0;out[0].s=0;
  for(let i=1;i<out.length;i++){s+=Math.hypot(out[i].x-out[i-1].x,out[i].y-out[i-1].y);out[i].s=s}
  return {p:out,len:s};
}
function mkFollower(path){return {path:path,s:0,i:0,x:path.p[0].x,y:path.p[0].y,a:0,done:false}}
function stepFollower(f,ds){
  f.s=Math.min(f.path.len,f.s+ds);
  const p=f.path.p;
  while(f.i<p.length-2&&p[f.i+1].s<=f.s)f.i++;
  const a=p[f.i],b=p[f.i+1],seg=(b.s-a.s)||1,t=clamp((f.s-a.s)/seg,0,1);
  f.x=a.x+(b.x-a.x)*t;f.y=a.y+(b.y-a.y)*t;f.a=Math.atan2(b.y-a.y,b.x-a.x);
  if(f.s>=f.path.len)f.done=true;
}

function updateChase(dt){
  if(runner.vis){stepFollower(runner.f,210*dt);runner.x=runner.f.x;runner.y=runner.f.y;if(runner.f.done)runner.vis=false}
  if(wreck.vis&&Math.random()<dt*6)smoke(wreck.x+(Math.random()-.5)*14,wreck.y+(Math.random()-.5)*10);
  if(crim.mode==='stalled'&&crim.vis&&Math.random()<dt*6)smoke(crim.x,crim.y);
  if(crim.mode!=='chase')return;
  const p=playerPos(),d=Math.hypot(p.x-crim.x,p.y-crim.y);
  let spd;
  if(crim.kind===1){spd=d<380?410:345;if(d>1000)spd=210;if(d>1700)spd=70}
  else if(crim.kind===3){spd=d<450?525:455;if(d>1200)spd=300;if(d>2000)spd=140}
  else{spd=d<450?500:430;if(d>1200)spd=300;if(d>2000)spd=140}
  crim.v=lerp(crim.v,spd,Math.min(1,dt*2));
  stepFollower(crim.f,crim.v*dt);
  crim.x=crim.f.x;crim.y=crim.f.y;crim.a=angLerp(crim.a,crim.f.a,Math.min(1,dt*10));
  if(crim.kind===3)updateEscorts(dt);
  if(Math.random()<dt*20)emit(glowPS,{x:crim.x-Math.cos(crim.a)*26,y:8,z:crim.y-Math.sin(crim.a)*26,vx:-Math.cos(crim.a)*40,vy:6,vz:-Math.sin(crim.a)*40,g:0,l:.5,m:.5,s0:5,s1:1,r:1,gc:.45,b:.2,a:.9});
  if(d>1300){crim.farT+=dt;if(crim.farT>5){crim.farT=0;toast('اللاسلكي: ابقَ قريباً منه!',2200)}}else crim.farT=0;
  if(crim.kind>=2){
    const sp=inCar?Math.abs(car.v):0;
    if(d<170)crim.catchP+=dt*(crim.kind===3?0.15:0.2)*(sp>crim.v?1.4:1);else crim.catchP-=dt*0.05;
    crim.hitCd-=dt;
    if(d<48&&crim.hitCd<=0){crim.catchP+=.1;crim.hitCd=1;shake=.5;sparks(crim.x,crim.y,12);beep(120,.2,'square',.08,.5)}
    crim.catchP=clamp(crim.catchP,0,1);
    $('catchF').style.width=(crim.catchP*100)+'%';
    if(crim.catchP>=1){crim.kind===3?endChase3(true):endChase2(true);return}
  }
  if(crim.f.done){crim.kind===1?endChase1():(crim.kind===3?endChase3(false):endChase2(false))}
}

const MAXV=520,MAXN=780;
function updateCar(dt,a){
  let sIn=0;
  if(steerMode==='stick')sIn=a.on?clamp(a.x*1.25,-1,1):0;
  else{sIn=(inp.sr?1:0)-(inp.sl?1:0);if(!sIn&&!inp.stick)sIn=a.x}
  const sp0=Math.abs(car.v),sf=clamp(sp0/MAXN,0,1);
  sIn*=1-.32*sf;
  const rate=sIn===0?14:(Math.sign(sIn)===Math.sign(car.steer)||car.steer===0?8:16);
  car.steer+=(sIn-car.steer)*Math.min(1,dt*rate);
  const gas=inp.gas||keys.KeyW||keys.ArrowUp,brake=inp.brake||keys.KeyS||keys.ArrowDown;
  const nb=inp.nitro&&car.nitro>(car.locked?25:2)&&!brake;
  if(inp.nitro&&car.nitro<=2)car.locked=true;
  if(car.nitro>=25)car.locked=false;
  let target,acc;
  if(brake){target=-120;acc=car.v>30?1000:360}
  else if(nb){target=MAXN;acc=900}
  else if(gas){target=MAXV;acc=440-170*clamp(car.v/MAXV,0,1)}
  else if(autoGas){target=Math.abs(car.steer)>.55?240:320;acc=car.v<target?400:320}
  else{target=0;acc=260}
  if(nb)car.nitro=Math.max(0,car.nitro-36*(1-.14*U.nitro)*dt);else car.nitro=Math.min(100,car.nitro+13*(1+.3*U.nitro)*dt);
  const prevV=car.v;
  car.v+=clamp(target-car.v,-acc*dt,acc*dt);
  const sp=Math.abs(car.v),grip=clamp(sp/55,0,1);
  const yaw=lerp(3.3,1.9,sf);
  car.a+=car.steer*yaw*grip*(car.v<0?-1:1)*dt;
  const hx=Math.cos(car.a),hy=Math.sin(car.a);
  const k=1-Math.exp(-(Math.abs(car.steer)>.6&&sp>380?6:11)*dt);
  car.vx=lerp(car.vx,hx*car.v,k);car.vy=lerp(car.vy,hy*car.v,k);
  car.x+=car.vx*dt;car.y+=car.vy*dt;
  const hit=resolve(car,17);
  if(hit){
    const vn=car.vx*rnx+car.vy*rny;
    if(vn<0){
      if(!car.hitPrev&&-vn>150){damageCar((-vn-120)*.07);shake=Math.max(shake,.4);beep(100,.2,'square',.08,.5);sparks(car.x+hx*18,car.y+hy*18,12)}
      car.vx-=vn*rnx*1.1;car.vy-=vn*rny*1.1;
      car.v=Math.max(-40,car.vx*hx+car.vy*hy);
    }
  }
  car.hitPrev=hit;
  const slip=Math.abs(-hy*car.vx+hx*car.vy);
  if(slip>80&&sp>180&&Math.random()<dt*30){
    for(const sd of [-1,1])smoke(car.x-hx*14-hy*11*sd,car.y-hy*14+hx*11*sd);
  }
  if(nb&&Math.random()<dt*40)emit(glowPS,{x:car.x-hx*26,y:7,z:car.y-hy*26,vx:-hx*140,vy:2,vz:-hy*140,g:0,l:.35,m:.35,s0:6,s1:1,r:.25,gc:.85,b:1,a:1});
  car.pitch=lerp(car.pitch,clamp((car.v-prevV)/Math.max(dt,.001)/2600,-.1,.1),Math.min(1,dt*6));
  car.roll=lerp(car.roll,-car.steer*grip*clamp(sp/MAXV,0,1)*.09,Math.min(1,dt*6));
}

/* ---------- حركات خاصة: تسلق وتحليق ---------- */
function bldAt(x,z,ign){let best=null;for(let i=0;i<bld.length;i++){const b=bld[i];if(b===ign)continue;if(x>=b.x&&x<=b.x+b.w&&z>=b.y&&z<=b.y+b.h&&(!best||b.h3>best.h3))best=b}return best}
function nearClimb(){
  let best=null,bd=14;
  for(let i=0;i<bld.length;i++){
    const b=bld[i];if(b.h3<12)continue;
    const dx=Math.max(b.x-foot.x,0,foot.x-b.x-b.w),dy=Math.max(b.y-foot.y,0,foot.y-b.y-b.h),d=Math.hypot(dx,dy);
    if(d<bd){bd=d;best=b}
  }
  return best;
}
function startClimb(c){
  const nx=clamp(foot.x,c.x,c.x+c.w),ny=clamp(foot.y,c.y,c.y+c.h);
  let ux=nx-foot.x,uy=ny-foot.y;const d=Math.hypot(ux,uy);if(d<.01||d>16)return;
  ux/=d;uy/=d;
  foot.m='climb';foot.cl={c:c,t:0,sp:clamp(c.h3/3.5,50,140)*(1+.3*U.climb),px:nx-ux*5.5,py:ny-uy*5.5,ux:ux,uy:uy,nx:nx,ny:ny,snd:0};
  foot.a=Math.atan2(uy,ux);foot.x=foot.cl.px;foot.y=foot.cl.py;beep(180,.12,'square',.04);
  hint('climbHint',c.h3>60?'تتسلّق… وفي القمة امشِ نحو الحافة لتفتح أجنحتك':'تتسلّق…',2600);
}
function climbUpdate(dt){
  const k=foot.cl;k.t+=dt;foot.walk+=dt*7;
  foot.fy=Math.min(k.c.h3,k.t*k.sp);foot.x=k.px;foot.y=k.py;
  k.snd-=dt;if(k.snd<=0){k.snd=.34;beep(120+Math.random()*60,.06,'square',.025)}
  if(lookId===null)fcam=angLerp(fcam,foot.a,Math.min(1,dt*2.2));
  if(Math.random()<dt*10)emit(smokePS,{x:k.nx,y:foot.fy,z:k.ny,vx:(Math.random()-.5)*8,vy:8,vz:(Math.random()-.5)*8,g:0,l:.8,m:.8,s0:3,s1:9,r:.5,gc:.5,b:.52,a:.35});
  if(foot.fy>=k.c.h3-.001){
    const c=k.c;
    foot.m='top';foot.top=c;foot.edge=0;
    foot.x=clamp(k.nx+k.ux*14,c.x+6,c.x+c.w-6);foot.y=clamp(k.ny+k.uy*14,c.y+6,c.y+c.h-6);foot.fy=c.h3;
    beep(420,.14,'sine',.05);
    if(c.h3>60)hint('topHint','في القمة: امشِ نحو الحافة أو اضغط 🪂 للتحليق بالأجنحة',3800);
  }
}
function startGlide(wings,ang,hop,vy0,sp0){
  const src=foot.top;
  foot.m='glide';foot.top=null;
  foot.g={a:ang,sp:sp0!=null?sp0:70,vy:vy0!=null?vy0:(hop?60:-30),t:0,wings:wings,open:0,ign:src,launch:vy0!=null&&vy0>200};
  foot.a=ang;beep(300,.4,'triangle',.05,2);setBtns('world');
}
function glideUpdate(dt,a){
  const g=foot.g;g.t+=dt;
  if(g.wings){
    g.open=clamp((g.t-.3)/.4,0,1);
    if(a.on)g.a+=clamp(a.x,-1,1)*1.7*dt;
    const dive=clamp(-a.y,-1,1);
    const wantT=(inp.nitro||keys.Space)&&!g.launch&&g.open>.5&&foot.turbo>(foot.tlock?25:2);
    const wantL=(inp.brake||keys.KeyB||keys.ShiftLeft)&&!g.launch&&g.open>.5&&!wantT;
    g.turbo=wantT;g.landing=wantL;
    if(wantT)foot.turbo=Math.max(0,foot.turbo-26*(1-.1*U.wings)*dt);else foot.turbo=Math.min(100,foot.turbo+9*dt);
    if(foot.turbo<=2)foot.tlock=true;if(foot.turbo>=25)foot.tlock=false;
    let tSp=(125+dive*70-(dive<0?-dive*45:0))*(1+.12*U.wings);
    if(wantT)tSp=340*(1+.12*U.wings);else if(wantL)tSp=105;
    g.sp+=(tSp-g.sp)*Math.min(1,dt*(wantT?3.5:1.6));
    if(g.launch){g.vy-=170*dt;if(g.vy<=0)g.launch=false}
    else{
      if(g.open<1)g.vy=Math.max(-420,g.vy-380*dt);
      if(g.open>0){
        let tVy=-(38+Math.max(0,dive)*55-Math.max(0,-dive)*14+clamp((foot.fy-300)/600,0,1)*40)*(1-.12*U.wings);
        if(wantT)tVy*=.3;
        if(wantL)tVy=-340;
        g.vy+=(tVy-g.vy)*Math.min(1,dt*g.open*(wantL?5:3.5));
      }
    }
    if(wantT){
      const hx2=Math.cos(g.a),hz2=Math.sin(g.a);
      for(let sd=-1;sd<=1;sd+=2){
        if(Math.random()<dt*70)emit(glowPS,{x:foot.x-hx2*10-hz2*sd*18,y:foot.fy+15,z:foot.y-hz2*10+hx2*sd*18,vx:-hx2*120,vy:0,vz:-hz2*120,g:0,l:.4,m:.4,s0:7,s1:1,r:.4,gc:.85,b:1,a:.95});
      }
      if(Math.random()<dt*10)nBurst(1100,1,'bandpass',.18,.14,.5);
    }
  }else{
    g.sp+=(40-g.sp)*Math.min(1,dt*2);g.vy=Math.max(-420,g.vy-460*dt);
    if(a.on&&Math.hypot(a.x,a.y)>.2){/* حرية بسيطة أثناء السقوط */g.a+=clamp(a.x,-1,1)*1.2*dt}
  }
  const hx=Math.cos(g.a),hz=Math.sin(g.a);
  let nx=foot.x+hx*g.sp*dt,nz=foot.y+hz*g.sp*dt;
  if(g.ign&&(foot.x<g.ign.x-3||foot.x>g.ign.x+g.ign.w+3||foot.y<g.ign.y-3||foot.y>g.ign.y+g.ign.h+3))g.ign=null;
  nx=clamp(nx,120,3080);nz=clamp(nz,120,3080);
  const hn=bldAt(nx,nz,g.ign);
  if(hn&&hn.h3>foot.fy+1){
    const hxb=bldAt(nx,foot.y,g.ign),hzb=bldAt(foot.x,nz,g.ign);
    if(!(hxb&&hxb.h3>foot.fy+1))foot.x=nx;
    else if(!(hzb&&hzb.h3>foot.fy+1))foot.y=nz;
    else{g.a+=Math.PI*.8;g.sp*=.35;shake=Math.max(shake,.25)}
  }else{foot.x=nx;foot.y=nz}
  foot.fy+=g.vy*dt;
  if(g.wings&&(g.landing||g.turbo||g.vy<-180)){
    const hx3=Math.cos(g.a),hz3=Math.sin(g.a),vl=Math.hypot(g.sp,g.vy),ln=clamp(vl*.06,8,34);
    for(let sd=-1;sd<=1;sd+=2){
      if(Math.random()<dt*55)emitStreak(foot.x-hz3*sd*(14+Math.random()*12),foot.fy+14+Math.random()*4,foot.y+hx3*sd*(14+Math.random()*12),g.sp*hx3,g.vy,g.sp*hz3,ln);
    }
  }
  foot.a=angLerp(foot.a,g.a,Math.min(1,dt*8));
  if(lookId===null)fcam=angLerp(fcam,g.a,Math.min(1,dt*1.6));
  const lb=bldAt(foot.x,foot.y,g.ign),h=lb?lb.h3:0;
  if(foot.fy<=h){
    const hard=g.vy<-250,imp=clamp((-g.vy-150)/250,0,1.3);
    foot.fy=h;foot.g=null;foot.landT=imp>.3?1:0;
    if(lb){setBtns('world');foot.m='top';foot.top=lb;foot.edge=0;foot.x=clamp(foot.x,lb.x+6,lb.x+lb.w-6);foot.y=clamp(foot.y,lb.y+6,lb.y+lb.h-6)}
    else{foot.m='ground';resolve(foot,7)}
    setBtns('world');
    beep(hard?90:200,.25,hard?'square':'sine',hard?.08:.04,.6);
    if(hard)shake=Math.max(shake,.5);
    if(imp>.3)impact(foot.x,foot.fy,foot.y,imp);
    for(let i=0;i<(hard?14:6);i++)emit(smokePS,{x:foot.x+(Math.random()-.5)*8,y:foot.fy+1,z:foot.y+(Math.random()-.5)*8,vx:(Math.random()-.5)*50,vy:10,vz:(Math.random()-.5)*50,g:0,l:.9,m:.9,s0:4,s1:14,r:.5,gc:.5,b:.52,a:.4});
    hint('landed','هبوط ناجح — يمكنك التسلق من جديد في أي مكان',2200);
  }
}
function camMove(a,m){
  const fx=Math.cos(fcam),fz=Math.sin(fcam),rx=-fz,rz=fx;
  return {x:(a.x*rx-a.y*fx)/m,y:(a.x*rz-a.y*fz)/m};
}
function updateFoot(dt,a){
  if(foot.landT>0){foot.landT=Math.max(0,foot.landT-dt*1.6);if(foot.landT>.55&&foot.m==='ground')return}
  if(foot.m==='climb'){climbUpdate(dt);return}
  if(foot.m==='glide'){glideUpdate(dt,a);return}
  const m=Math.hypot(a.x,a.y);
  const rq=(keys.KeyX?1:0)-(keys.KeyQ?1:0);if(rq)fcam+=rq*1.8*dt;
  if(foot.m==='top'){
    const c=foot.top;foot.fy=c.h3;
    if(m>.15){
      const w=camMove(a,m),s=Math.min(1,m)*(m>.9?100:78);
      const nx=foot.x+w.x*s*dt,nz=foot.y+w.y*s*dt;
      foot.a=angLerp(foot.a,Math.atan2(w.y,w.x),Math.min(1,dt*12));foot.walk+=dt*7;
      const out=nx<c.x+6||nx>c.x+c.w-6||nz<c.y+6||nz>c.y+c.h-6;
      foot.x=clamp(nx,c.x+6,c.x+c.w-6);foot.y=clamp(nz,c.y+6,c.y+c.h-6);
      if(out){
        foot.edge+=dt;
        if(c.h3>=60)hint('edgeFly','واصل الاتجاه نحو الفراغ لفتح الأجنحة',2400);
        if(foot.edge>(c.h3<30?.05:.5))startGlide(c.h3>=60,Math.atan2(w.y,w.x),false);
      }else foot.edge=0;
    }else foot.edge=0;
    return;
  }
  if(m>.15){
    const s=Math.min(1,m)*(m>.9?100:78);
    const w=camMove(a,m);
    foot.x+=w.x*s*dt;foot.y+=w.y*s*dt;foot.a=angLerp(foot.a,Math.atan2(w.y,w.x),Math.min(1,dt*12));foot.walk+=dt*7;
  }
  resolve(foot,7);
}
let exitTip=false;
function jumpFromCar(){
  if(!inCar||failing||dopen||mode!=='world')return;
  const sp=Math.abs(car.v);
  foot.x=car.x;foot.y=car.y;foot.fy=9;foot.a=car.a;foot.walk=0;fcam=car.a;
  inCar=false;setBtns('world');lastIn=null;
  startGlide(true,car.a,true,640,clamp(sp*.8,150,340));
  nBurst(700,1,'bandpass',.5,.18,2.2);
  hint('jumpOut','انطلقتَ فوق المدينة! وجّه تحليقك بالعصا (للأمام = انقضاض)',3200);
}
function coastCar(dt){
  car.v*=Math.exp(-1.5*dt);
  const hx=Math.cos(car.a),hy=Math.sin(car.a);
  car.vx=hx*car.v;car.vy=hy*car.v;car.x+=car.vx*dt;car.y+=car.vy*dt;
  if(resolve(car,17))car.v*=.3;
  car.steer*=.9;
  if(Math.abs(car.v)<3){car.v=0;car.vx=0;car.vy=0}
}
function toggleCar(){
  if(mode!=='world')return;
  if(summon&&summon.auto)stopAuto();
  if(inCar){
    if(Math.abs(car.v)>90){toast('أبطئ السيارة أولاً',1500);return}
    foot.x=car.x+Math.cos(car.a-Math.PI/2)*30;foot.y=car.y+Math.sin(car.a-Math.PI/2)*30;foot.a=car.a;foot.fy=0;foot.m='ground';foot.top=null;foot.g=null;fcam=car.a;
    resolve(foot,7);car.v=0;car.vx=0;car.vy=0;inCar=false;doorSfx(true);
    setBtns('world');if(!exitTip){exitTip=true;toast('على قدميك: اقترب من الناس · اسحب يمين الشاشة لتدوير الكاميرا · 📡 يستدعي السيارة',4200)}
  }else{
    const d=Math.hypot(foot.x-car.x,foot.y-car.y);
    if(summon){if(d<75&&foot.fy<=20){summon=null;car.v=0;car.vx=0;car.vy=0;inCar=true;setBtns('world');doorSfx(false);beep(70,.5,'sawtooth',.05,2.4)}return}
    if(foot.m==='climb'){return}
    if(d<75&&foot.fy>20){toast('انزل إلى الأرض أولاً',1500);return}
    if(d<75){inCar=true;setBtns('world');doorSfx(false);beep(70,.5,'sawtooth',.05,2.4)}
    else{startSummon();hint('summon','السيارة في الطريق إليك عبر الشوارع',2000);beep(140,1,'sawtooth',.06,2)}

/* ---------- الطبقة الثنائية: أسماء وبوصلة ---------- */
function toScreen(x,y,z){
  tmpV.set(x,y,z).applyMatrix4(camera.matrixWorldInverse);
  const behind=tmpV.z>-1,cx=tmpV.x,cz=tmpV.z;
  tmpV.set(x,y,z).project(camera);
  return {x:(tmpV.x*.5+.5)*W,y:(-tmpV.y*.5+.5)*H,behind:behind,cx:cx,cz:cz};
}
function drawCompass(o){
  const s=toScreen(o.x,14,o.y),m=40,top=64,bot=Math.round(H*.34);
  ctx.fillStyle='#ffd34e';ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=2;
  const d=Math.round(Math.hypot(o.x-playerPos().x,o.y-playerPos().y)/10);
  if(!s.behind&&s.x>m&&s.x<W-m&&s.y>top&&s.y<H-bot){
    const bob=Math.sin(T*5)*4;
    ctx.beginPath();ctx.moveTo(s.x,s.y-30+bob);ctx.lineTo(s.x-9,s.y-46+bob);ctx.lineTo(s.x+9,s.y-46+bob);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.font='800 12px Cairo,sans-serif';ctx.textAlign='center';ctx.fillText(d+' م',s.x,s.y-52+bob);
  }else{
    let px,py,ang;
    if(s.behind){px=s.cx>=0?W-m:m;py=H-bot;ang=s.cx>=0?0:Math.PI}
    else{px=clamp(s.x,m,W-m);py=clamp(s.y,top,H-bot);ang=Math.atan2(s.y-H/2,s.x-W/2)}
    ctx.save();ctx.translate(px,py);ctx.rotate(ang);
    ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-9,-11);ctx.lineTo(-9,11);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
    ctx.font='800 12px Cairo,sans-serif';ctx.textAlign='center';ctx.fillText(d+' م',clamp(px,30,W-30),clamp(py+24,20,H-8));
  }
}
function drawOverlay(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  if(mode==='title')return;
  const p=playerPos();
  if(mode==='world'&&!dopen&&!duel.on){
    ctx.textAlign='center';
    for(const n of npcs){
      if(n.vis&&!n.vis())continue;
      const d=Math.hypot(p.x-n.x,p.y-n.y);
      if(d>420)continue;
      const s=toScreen(n.x,28+(n.z||0),n.y);if(s.behind)continue;
      if(n.hot&&n.hot()){ctx.fillStyle='#ffd34e';ctx.font='900 24px Cairo,sans-serif';ctx.fillText('!',s.x,s.y-18+Math.sin(T*5)*3)}
      if(d<200){ctx.font='700 13px Cairo,sans-serif';const tw=ctx.measureText(n.n).width+14;ctx.fillStyle='rgba(6,10,20,.8)';ctx.fillRect(s.x-tw/2,s.y-12,tw,20);ctx.fillStyle='#fff';ctx.fillText(n.n,s.x,s.y+3)}
    }
    for(const sp of spots){
      if(!sp.flavor||sp.done)continue;
      const d=Math.hypot(p.x-sp.x,p.y-sp.y);if(d>260)continue;
      const s=toScreen(sp.x,6,sp.y);if(s.behind)continue;
      ctx.fillStyle='rgba(255,255,255,'+(.35+.3*Math.sin(T*5))+')';ctx.beginPath();ctx.arc(s.x,s.y,4,0,7);ctx.fill();
    }
  }
  const o=objInfo();
  if(o&&!o.hide&&!dopen&&(mode==='world'||mode==='intro')&&!(mode==='intro'&&R.state!=='walk'&&R.state!=='fall'))drawCompass(o);
  if(mode==='intro'&&R.state==='walk'&&!dopen){
    const dE=Math.min(foot.x-TW.x,TW.x+TW.w-foot.x,foot.y-TW.y,TW.y+TW.h-foot.y);
    if(dE<48){ctx.fillStyle='#ffd34e';ctx.font='800 17px Cairo,sans-serif';ctx.textAlign='center';ctx.fillText('الحافة — اضغط «اقفز»',W/2,H*.3+Math.sin(T*4)*4)}
  }
  if(duel.on)duelOverlay();
  const slv=speedLines();
  if(slv){
    ctx.strokeStyle='rgba(180,240,255,.22)';ctx.lineWidth=1.5;
    for(let i=0;i<14*slv;i++){const ang=Math.random()*6.28,r1=Math.min(W,H)*(.34+Math.random()*.2);ctx.beginPath();ctx.moveTo(W/2+Math.cos(ang)*r1,H/2+Math.sin(ang)*r1);ctx.lineTo(W/2+Math.cos(ang)*(r1+70),H/2+Math.sin(ang)*(r1+70));ctx.stroke()}
  }
}

/* ---------- مساعدات المواقع ---------- */
function hitsSolid(o,r){
  for(let i=0;i<solids.length;i++){
    const b=solids[i];
    if(o.x<b.x-r||o.x>b.x+b.w+r||o.y<b.y-r||o.y>b.y+b.h+r)continue;
    const cx=clamp(o.x,b.x,b.x+b.w),cy=clamp(o.y,b.y,b.y+b.h);
    if((o.x-cx)*(o.x-cx)+(o.y-cy)*(o.y-cy)<r*r)return true;
  }
  return false;
}
function snapFree(x,y,r){
  const t={x:clamp(x,160,3040),y:clamp(y,160,3040)};
  if(!hitsSolid(t,r))return t;
  for(let k=1;k<50;k++)for(let a=0;a<12;a++){
    const q={x:clamp(x+Math.cos(a*.5236)*k*12,160,3040),y:clamp(y+Math.sin(a*.5236)*k*12,160,3040)};
    if(!hitsSolid(q,r))return q;
  }
  return t;
}

function dNext(){

  Object.assign(duel,{b:b,bt:0,st:'wait',mash:0,hv:0,holding:false,out:null,tsT:b.slow||1,trH:false,trK:false});
  if(b.shot)dShot(b.shot);

/* المدخلات */
function dInput(kind,dir){
  const b=duel.b;if(!duel.on||duel.st!=='wait'||!b||b.c!=='q')return;
  if(kind==='swipe'){if(b.type==='swipe')dResolve(dir===b.dir);return}
  if(kind==='tap'){
    if(b.type==='tap'||b.type==='swipe')dResolve(true);
    else if(b.type==='mash'){
      duel.mash++;duel.sw=!duel.sw;duel.pk=.14;beep(300+duel.mash*28,.04,'square',.04);
      const col=duel.sw?CY:CW,x=duel.kxA-12;
      dHit(x,TOWER_H+8+Math.random()*12,duel.cy,col,.6);
      
      $('qIco').style.setProperty('--g',Math.round(duel.mash/b.need*360)+'deg');
      if(duel.mash>=b.need)dResolve(true);
    }
    return;
  }
  if(kind==='holdStart'&&b.type==='hold')duel.holding=true;
  if(kind==='holdEnd')duel.holding=false;
}
function dResolve(ok){
  const b=duel.b;if(duel.st!=='wait')return;
  duel.st='res';duel.holding=false;qHide(ok?'ok':'bad');
  let name;
  if(ok){name=b.ok;if(b.kh!=null)duel.kh=b.kh;beep(880,.1,'sine',.06,1.4)}
  else{name=b.fail||'hit';duel.hearts--;duel.repeat=!!b.final;if(duel.hearts<=0)duel.dead=true;beep(120,.3,'sawtooth',.08,.4)}
  duel.out=OUT[name];duel.ot=0;duel.evi=0;duel.tsT=1;
  dDraw();
}
function dEndRes(){
  duel.tsT=1;duel.trH=false;duel.trK=false;
  if(duel.dead){
    duel.dead=false;duel.hearts=3;duel.kh=5;duel.i=0;duel.repeat=false;
    dSub('الظل','«لن أستسلم… مرة أخرى.»',2200);dDraw();dNext();return;
  }
  if(duel.repeat){duel.repeat=false;duel.i--}
  dNext();
}
function duelUpdate(rdt){
  const d=duel;d.t+=rdt;
  if(shake>0)shake=Math.max(0,shake-rdt*1.8);
  d.flash=Math.max(0,d.flash-rdt*2.2);d.lines=Math.max(0,d.lines-rdt*2.5);d.hurtV=Math.max(0,d.hurtV-rdt*1.2);d.fovk*=Math.exp(-6*rdt);
  d.ts=lerp(d.ts,d.tsT,1-Math.exp(-12*rdt));
  let sdt=rdt*d.ts;if(d.hs>0){d.hs-=rdt;sdt=rdt*.03}
  const b=d.b;
  if(d.st==='wait'&&b){
    d.bt+=rdt;
    if(b.c==='cine'){if(d.bt>=b.d)dNext()}
    else{
      const left=Math.max(0,1-d.bt/b.d);$('qIco').style.setProperty('--p',Math.round(left*360)+'deg');
      if(b.type==='hold'){
        d.hv=d.holding?Math.min(1,d.hv+rdt/b.hold):Math.max(0,d.hv-rdt*1.4);
        $('qIco').style.setProperty('--g',Math.round(d.hv*360)+'deg');
        if(d.holding&&Math.random()<rdt*30)pf(d.hxA+12,TOWER_H+14,d.cy,2,b.final?CY:CG,60,30);
        if(d.hv>=1)dResolve(true);
      }
      if(d.st==='wait'&&d.bt>=b.d)dResolve(false);
    }
  }else if(d.st==='res'&&d.out){
    d.ot+=sdt;
    if(d.ot>=d.out.dur+.15)dEndRes();
  }
  dAnim(rdt,sdt);
  dFxUpdate(rdt);updateExtras(rdt);
}

  }else if(d.b&&d.b.c==='q'){T=TELE[d.b.tele](clamp(d.bt/d.b.d,0,1),d)}
  else{T={};if(d.b&&d.b.kneel){T.k=KP({sy:.62,lean:-.3,ar:.2,al:.2,keep:1})}}
  const raw=d.st==='res'&&d.out&&d.out.raw;
  const hdx=T.hdx||0,hdy=Math.max(0,T.hdy||0),kdx=T.kdx||0,kdy=T.kdy||0;
  const h=HP(T.h),k=KP(T.k),res=d.st==='res',a=1-Math.exp(-(res?24:9)*rdt),ap=1-Math.exp(-(res?30:9)*rdt);
  const bob=Math.sin(d.t*2.2)*1.0;
  const nhx=lerp(d.hxA,cx-62+hdx+bob,ap),nkx=lerp(d.kxA,cx+62+kdx-bob*.6,raw?1:ap);
  d.hyA=lerp(d.hyA,hdy,res?1-Math.exp(-40*rdt):ap);

  const hv=(nhx-d.hxA)/dtS,kv=(nkx-d.kxA)/dtS;
  d.hph+=Math.abs(nhx-d.hxA)*.26;d.kph+=Math.abs(nkx-d.kxA)*.26;
  d.hacc+=Math.abs(nhx-d.hxA);d.kacc+=Math.abs(nkx-d.kxA);

  // جري تلقائي: الأرجل والذراعان تتحرك حسب السرعة
  const mix=(P,v,ph,face)=>{
    const amp=clamp((Math.abs(v)-45)/150,0,1)*((v*face>0)?1:.5);

      const s=Math.sin(ph)*1.0*amp;

function updateAlert(dt,p,inChase){
  if(!F.c2||F.final||inChase){alr=Math.max(0,alr-dt*.3);return}
  let thr=0,nearest=1e9;
  for(const o of traffic){
    if(!o.patrol)continue;
    const d=Math.hypot(p.x-o.x,p.y-o.y);nearest=Math.min(nearest,d);
    let R,k;
    if(inCar){R=260;k=Math.abs(car.v)>240?1.2:.55}
    else if(foot.m==='top'){R=120;k=.25}
    else if(foot.m==='glide'){R=220;k=.9}
    else{R=150;k=.8}
    if(d<R)thr+=(1-d/R)*k;
  }
  if(thr>0)alr=Math.min(1,alr+thr*dt*.75*(1-.14*U.stealth));else alr=Math.max(0,alr-dt*.14);
  sirT-=dt;if(sirT<=0&&nearest<340){sirT=.9;beep(Math.floor(T*1.1)%2?720:940,.4,'sine',.03)}
  if(alr>=1)failSequence('رصدتك الدوريات','أُعيدت إليك سيارتك عند آخر نقطة آمنة…');
}

const SFX={wind:null,rum:null,scr:null,noise:null,t:null,hb:0,st:0,event:12,lastStep:0};
function startAmbience(){
  if(!AC||SFX.wind)return;
  try{
    const len=Math.floor(AC.sampleRate*2),nb=AC.createBuffer(1,len,AC.sampleRate),d=nb.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;SFX.noise=nb;
    const mk=(type,freq,q)=>{
      const sr=AC.createBufferSource();sr.buffer=nb;sr.loop=true;
      const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;
      const g=AC.createGain();g.gain.value=0;sr.connect(f);f.connect(g);g.connect(AC.destination);sr.start();
      return {f:f,g:g};
    };
    SFX.wind=mk('bandpass',600,.6);
    SFX.rum=mk('lowpass',150,.7);
    SFX.scr=mk('bandpass',2400,7);
    const so=AC.createOscillator();so.type='square';so.frequency.value=800;const sf=AC.createBiquadFilter();sf.type='lowpass';sf.frequency.value=1800;
    const sg=AC.createGain();sg.gain.value=0;const sp=AC.createStereoPanner?AC.createStereoPanner():null;
    so.connect(sf);sf.connect(sg);if(sp){sg.connect(sp);sp.connect(AC.destination)}else sg.connect(AC.destination);so.start();
    SFX.sir={o:so,g:sg,p:sp};
    SFX.t=setInterval(ambTick,100);
  }catch(e){SFX.wind=null}
}
function sfxPass(pan,g,sp){
  if(!AC||!SFX.noise||!sfxOn)return;
  try{
    const t=AC.currentTime,dur=.95,gv=Math.max(.002,g*SET.sv);
    const sr=AC.createBufferSource();sr.buffer=SFX.noise;
    const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=1.1;f.frequency.setValueAtTime(1700,t);f.frequency.exponentialRampToValueAtTime(420,t+dur);
    const gg=AC.createGain();gg.gain.setValueAtTime(.0003,t);gg.gain.exponentialRampToValueAtTime(gv,t+dur*.3);gg.gain.exponentialRampToValueAtTime(.0002,t+dur);
    const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(105+sp*.1,t);o.frequency.exponentialRampToValueAtTime(62+sp*.05,t+dur);
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;
    const og=AC.createGain();og.gain.setValueAtTime(.0003,t);og.gain.exponentialRampToValueAtTime(gv*.8,t+dur*.3);og.gain.exponentialRampToValueAtTime(.0002,t+dur);
    const pn=AC.createStereoPanner?AC.createStereoPanner():null;
    sr.connect(f);f.connect(gg);o.connect(lp);lp.connect(og);
    if(pn){pn.pan.setValueAtTime(pan,t);gg.connect(pn);og.connect(pn);pn.connect(AC.destination)}else{gg.connect(AC.destination);og.connect(AC.destination)}
    sr.start(t,Math.random()*1.5);sr.stop(t+dur+.05);o.start(t);o.stop(t+dur+.05);
  }catch(e){}
}
function crashSfx(k){
  nBurst(1900,.7,'bandpass',.35,.13*k,.25);nBurst(420,.8,'lowpass',.45,.16*k,.4);
  if(typeof thump==='function'){thump(0,.14*k);thump(.09,.08*k)}
  beep(180,.25,'square',.05*k,.4);
}
function doorSfx(open){nBurst(1100,2.5,'bandpass',.07,.11);setTimeout(()=>{nBurst(260,1,'lowpass',.1,.14);if(typeof thump==='function')thump(0,.1)},open?60:90)}
let nitPrev=false;
function trafficAudio(dt){
  if(mode!=='world'||!AC||!SFX.noise)return;
  const p=playerPos();camera.getWorldDirection(tmpV);
  const fx=tmpV.x,fy=tmpV.z,rx=-fy,ry=fx;
  let nd=1e9,nx=0,ny=0;
  for(const o of traffic){
    if(o.patrol&&!F.c2)continue;
    const dx=o.x-p.x,dy=o.y-p.y,d=Math.hypot(dx,dy);
    if(o._pd!==undefined){
      if(o._pd>d)o._dec=true;
      else if(o._dec&&d>o._pd&&o._pd<130&&!(o._cd>0)){
        o._dec=false;o._cd=3;
        const pan=clamp((dx*rx+dy*ry)/(d||1),-1,1);
        sfxPass(pan,clamp(.17*(1-o._pd/130)+.03,.03,.2)*(o.patrol?1.15:1),o.sp||200);
      }
    }
    if(o._cd>0)o._cd-=dt;
    o._pd=d;
    if(o.patrol&&d<nd){nd=d;nx=dx;ny=dy}
  }
  const S=SFX.sir;
  if(S){
    const t=AC.currentTime,on=sfxOn&&nd<900;
    S.g.gain.setTargetAtTime(on?Math.pow(1-nd/900,1.6)*.05*SET.sv:0,t,.15);
    S.o.frequency.setTargetAtTime(((T*1.4)%2<1)?940:740,t,.03);
    if(S.p&&on)S.p.pan.setTargetAtTime(clamp((nx*rx+ny*ry)/(nd||1),-1,1),t,.1);
  }
  const nit=inCar&&inp.nitro&&car.nitro>2;
  if(nit&&!nitPrev){nBurst(800,.8,'bandpass',.5,.1,3);beep(170,.45,'sawtooth',.05,2.6)}
  if(!nit&&nitPrev){nBurst(3400,.6,'highpass',.3,.06)}
  nitPrev=nit;
}
function nBurst(freq,q,type,dur,g,sweep){
  if(!AC||!SFX.noise||!sfxOn)return;
  try{
    const t=AC.currentTime,sr=AC.createBufferSource();sr.buffer=SFX.noise;
    const f=AC.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);if(sweep)f.frequency.exponentialRampToValueAtTime(Math.max(40,freq*sweep),t+dur);if(q)f.Q.value=q;
    const gg=AC.createGain();gg.gain.setValueAtTime(Math.max(.0003,g*SET.sv),t);gg.gain.exponentialRampToValueAtTime(.0002,t+dur);
    sr.connect(f);f.connect(gg);gg.connect(AC.destination);sr.start(t,Math.random()*1.5);sr.stop(t+dur+.03);
  }catch(e){}
}
function thump(delay,g){
  if(!AC||!sfxOn)return;
  try{
    const t=AC.currentTime+delay,o=AC.createOscillator(),gg=AC.createGain();
    o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(34,t+.14);
    gg.gain.setValueAtTime(Math.max(.0003,g*SET.sv),t);gg.gain.exponentialRampToValueAtTime(.0002,t+.18);
    o.connect(gg);gg.connect(AC.destination);o.start(t);o.stop(t+.2);
  }catch(e){}
}
function footstep(){nBurst(500+Math.random()*200,1,'lowpass',.07,.07,.6)}
function ambTick(){
  if(!AC||!SFX.wind||mode!=='world'||!sfxOn)return;
  const dt=.1;
  const chase=crim.mode==='chase',tense=alr>.4;
  if(chase||tense){
    SFX.hb-=dt;
    if(SFX.hb<=0){SFX.hb=chase?.5:.85;thump(0,chase?.34:.22);thump(chase?.16:.2,chase?.2:.13)}
  }
  if(tense&&Math.random()<.35)nBurst(2800,3,'bandpass',.05+Math.random()*.06,.05+alr*.05);
  SFX.event-=dt;
  if(SFX.event<=0&&!chase){
    SFX.event=10+Math.random()*20;
    const k=Math.floor(Math.random()*4);
    if(k===0)nBurst(900,5,'bandpass',1.4,.05,.35);            // صرير معدن بعيد
    else if(k===1)nBurst(220,1,'lowpass',1.8,.2,.5);            // ارتطام بعيد
    else if(k===2){nBurst(1400,8,'bandpass',.5,.025,1.8)}       // زجاج/صفير هواء
    else {nBurst(300,1,'lowpass',2.4,.14,.4);thump(.6,.1)}      // هدير عميق
  }
}
function audioFrame(dt){
  if(!AC||!SFX.wind)return;
  trafficAudio(dt);
  const t=AC.currentTime,on=sfxOn&&mode!=='title';
  let sp=0;
  if(mode==='intro'&&R.state==='fall')sp=clamp(-R.vy/340,0,1.1);
  else if(inCar)sp=Math.abs(car.v)/MAXV;
  else if(foot.m==='glide'&&foot.g)sp=foot.g.sp/180+.25;
  const gust=.035+.025*Math.sin(T*.37)*Math.sin(T*.11+1),top=foot.m==='top'||foot.m==='climb'?.05:0,nit=(inCar&&inp.nitro&&car.nitro>2)?.12:0;
  SFX.wind.g.gain.setTargetAtTime(on?Math.min(.5,gust+top+sp*.26+nit)*SET.sv:0,t,.15);
  SFX.wind.f.frequency.setTargetAtTime(450+sp*1100,t,.2);
  const chase=mode==='world'&&crim.mode==='chase';
  SFX.rum.g.gain.setTargetAtTime(on?(.08+(chase?.07:0)+alr*.06)*SET.sv:0,t,.6);
  const slip=inCar?Math.abs(-Math.sin(car.a)*car.vx+Math.cos(car.a)*car.vy):0;
  SFX.scr.g.gain.setTargetAtTime(on&&inCar&&slip>90&&Math.abs(car.v)>170?Math.min(.09,(slip-90)/600)*SET.sv:0,t,.05);
  if(mode==='world'&&!inCar&&(foot.m==='ground'||foot.m==='top')){
    const n=Math.floor(foot.walk/3.1416);
    if(n!==SFX.lastStep){SFX.lastStep=n;footstep()}
  }
}

const STK_N=160,stkPos=new Float32Array(STK_N*6),stkCol=new Float32Array(STK_N*6),stk=[];
const stkGeo=new THREE.BufferGeometry();

function emitStreak(x,y,z,dx,dy,dz,len){
  if(stk.length>=STK_N)return;
  const l=Math.hypot(dx,dy,dz)||1;
  stk.push({x:x,y:y,z:z,dx:dx/l,dy:dy/l,dz:dz/l,len:len,t:0,m:.5});
}
function updateStreaks(dt){
  let n=0;
  for(let i=stk.length-1;i>=0;i--){stk[i].t+=dt;if(stk[i].t>=stk[i].m){stk[i]=stk[stk.length-1];stk.pop()}}
  for(let i=0;i<stk.length;i++){
    const o=stk[i],f=1-o.t/o.m,k=i*6;
    stkPos[k]=o.x;stkPos[k+1]=o.y;stkPos[k+2]=o.z;
    stkPos[k+3]=o.x-o.dx*o.len;stkPos[k+4]=o.y-o.dy*o.len;stkPos[k+5]=o.z-o.dz*o.len;
    stkCol[k]=.55*f;stkCol[k+1]=.9*f;stkCol[k+2]=1*f;stkCol[k+3]=0;stkCol[k+4]=0;stkCol[k+5]=0;
    n++;
  }
  stkGeo.setDrawRange(0,n*2);
  stkGeo.attributes.position.needsUpdate=true;stkGeo.attributes.color.needsUpdate=true;
}

}
for(let i=0;i<3;i++){
  const m=new THREE.Mesh(new THREE.RingGeometry(.82,1,40),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false}));
  m.rotation.x=-Math.PI/2;m.visible=false;scn.add(m);rings.push({m:m,t:0,max:.55,r:60});
}
let crN=0,rgN=0;
function impact(x,y,z,k){
  const c=craters[crN++%craters.length];
  c.m.position.set(x,y+.35,z);c.m.scale.setScalar(26+k*46);c.m.rotation.z=Math.random()*6.28;c.m.material.opacity=1;c.m.visible=true;c.t=0;
  const r=rings[rgN++%rings.length];r.m.position.set(x,y+.6,z);r.t=0;r.r=70+k*80;r.m.visible=true;
  shake=Math.max(shake,.7+k*.5);
  for(let i=0;i<30;i++){const a=i/30*6.283+Math.random()*.2,sp=70+Math.random()*120*k;emit(smokePS,{x:x,y:y+2,z:z,vx:Math.cos(a)*sp,vy:10+Math.random()*30,vz:Math.sin(a)*sp,g:0,l:1.6,m:1.6,s0:8,s1:34,r:.5,gc:.45,b:.4,a:.7})}
  for(let i=0;i<22;i++){const a=Math.random()*6.283,sp=40+Math.random()*130*k;emit(smokePS,{x:x,y:y+3,z:z,vx:Math.cos(a)*sp,vy:90+Math.random()*190*k,vz:Math.sin(a)*sp,g:-380,l:1.1,m:1.1,s0:4,s1:2.5,r:.16,gc:.14,b:.13,a:.95})}
  for(let i=0;i<20;i++){const a=Math.random()*6.283,sp=60+Math.random()*160;emit(glowPS,{x:x,y:y+4,z:z,vx:Math.cos(a)*sp,vy:60+Math.random()*140,vz:Math.sin(a)*sp,g:-320,l:.6,m:.6,s0:3,s1:1,r:1,gc:.72,b:.3,a:1})}
  nBurst(110,1,'lowpass',1.2,.55,.35);nBurst(1200,2,'bandpass',.22,.22,.3);thump(0,.6);beep(70,.5,'square',.1,.4);
}
function fxUpdate(dt){
  for(const c of craters){if(!c.m.visible)continue;c.t+=dt;const u=c.t/c.max;if(u>=1){c.m.visible=false;continue}c.m.material.opacity=u<.7?1:1-(u-.7)/.3}
  for(const r of rings){if(!r.m.visible)continue;r.t+=dt;const u=r.t/r.max;if(u>=1){r.m.visible=false;continue}r.m.scale.setScalar(4+u*r.r);r.m.material.opacity=.7*(1-u)}
  updateStreaks(dt);
}
function speedLines(){
  if(mode!=='world')return 0;
  if(inCar)return car.v>560?1:0;
  if(foot.m==='glide'&&foot.g&&foot.g.wings)return foot.g.landing?2:((foot.g.turbo||foot.g.vy<-200)?1:0);
  return 0;
}

/* ---------- الحلقة الرئيسية ---------- */
let lastT=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;T+=dt;
  if(typ&&typ.i<typ.t.length){typ.acc+=dt*55;const n=Math.floor(typ.acc);if(n>typ.i){typ.i=Math.min(typ.t.length,n);dlgT.textContent=typ.t.slice(0,typ.i)}}
  if(mode==='intro')introUpdate(dt);
  else if(mode==='world')worldUpdate(dt);
  else {foot.walk+=dt}
  updateCamera(dt);
  syncScene(dt);
  if(duel.on)dPose();
  if(mode!=='title'){const p=playerPos();drawMini(p,inCar?car.a:foot.a)}
  drawOverlay();
  renderer.render(scn,camera);
  inp.actEdge=false;inp.carEdge=false;
  requestAnimationFrame(loop);
}

/* ---------- البدء والحفظ ---------- */
function startWorld(cont){
  mode='world';zone.style.display='block';noteOpen=false;$('note').style.display='none';
  foot.fy=0;foot.sc=1;car.canopy=0;foot.m='ground';foot.top=null;foot.g=null;foot.cl=null;
  if(cont){
    const s=loadSave();
    if(s){
      applySave(s);
      car.x=s.cx;car.y=s.cy;car.a=s.a;car.v=0;car.vx=0;car.vy=0;foot.x=s.x;foot.y=s.y;foot.a=s.a;fcam=s.a;inCar=!!s.inCar;
      camPos.set(s.x-Math.cos(s.a)*80,40,s.y-Math.sin(s.a)*80);camAng=s.a;
      if(F.chase1)wreck.vis=true;
      if(F.container&&!F.caught)startChase2();
      else if(F.caught&&!F.c2)setTimeout(()=>startChapter2(),600);
      else if(F.bank&&!F.king)startChase3();
    }
    fadeTo(false);
  }else{
    car.a=-Math.PI/2;car.v=140;car.vx=0;car.vy=-140;inCar=true;camAng=car.a;
    foot.x=car.x;foot.y=car.y;
    startChase1();
    const c=$('card');c.style.display='flex';$('cardT').textContent='الفصل الأول';$('cardP').textContent='مطاردة الليل';$('cardBtn').style.display='none';
    setTimeout(()=>{fadeTo(false)},350);
    setTimeout(()=>{c.style.display='none';banner('مطاردة الليل','السيارة السوداء أمامك!');
      toast('◀ ▶ توجيه · 🏁 تسارع · ⚡ نيترو',3500)},2300);
    setTimeout(()=>{toast('اللاسلكي: لا تدعه يفلت!',2500)},10000);
  }
  lastIn=null;setBtns('world');
}
function begin(cont){
  initAudio();startAmbience();
  if(window.innerHeight>window.innerWidth){
    try{const el=document.documentElement;const rf=el.requestFullscreen||el.webkitRequestFullscreen;if(rf)rf.call(el)}catch(e){}
    try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
  }
  $('title').style.display='none';
  if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}
  if(cont&&loadSave()){startWorld(true)}
  else{
    resetProgress();
    introStart();
  }
}
$('btnStart').addEventListener('click',()=>{openSlots('new')});
$('btnCont').addEventListener('click',()=>{openSlots('load')});
refreshTitle();
window.addEventListener('beforeunload',()=>{if(mode==='world')saveGame()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='world')saveGame()});

// شاشة العنوان: السيارة والبطل على البرج
car.x=1400;car.y=1600;car.a=-Math.PI/2;
foot.x=1600;foot.y=1600;foot.fy=TOWER_H;
camPos.set(1930,TOWER_H+95,1600);camLook.set(1600,TOWER_H+10,1600);
$('loadmsg').textContent='';$('btnStart').disabled=false;
requestAnimationFrame(loop);
};

/* ---------- تحميل محرك الرسوميات ---------- */
(function(){
  var urls=['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js','https://unpkg.com/three@0.128.0/build/three.min.js'];
  var i=0;
  function load(){
    if(i>=urls.length){document.getElementById('loadmsg').textContent='تعذّر تحميل محرك الرسوميات. تأكد من الاتصال بالإنترنت ثم أعد فتح الصفحة.';return}
    var s=document.createElement('script');s.src=urls[i++];
    s.onload=function(){try{window.__bootGame()}catch(e){document.getElementById('loadmsg').textContent='خطأ في التشغيل: '+e.message;console.error(e)}};
    s.onerror=load;document.head.appendChild(s);
  }
  load();
})();
</script>
