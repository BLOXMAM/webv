<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطأ 404 - الفضاء الرقمي المفقود</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100vh;
            background: #050505;
            color: white;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 0 20px;
            max-width: 90%;
        }

        /* تأثير رقم 404 المتجاوب مع أحجام الشاشات */
        .error-code {
            font-size: clamp(6rem, 20vw, 15rem);
            font-weight: 700;
            margin: 0;
            line-height: 1;
            text-shadow: 2px 2px #ff0055, -2px -2px #00dbde;
            cursor: crosshair;
            transition: transform 0.3s, letter-spacing 0.3s;
            user-select: none;
        }

        .error-code:hover {
            letter-spacing: 15px;
            text-shadow: 8px 8px #ff0055, -8px -8px #00dbde;
        }

        h2 {
            font-size: clamp(1rem, 3vw, 1.8rem);
            color: #aaa;
            margin-top: 15px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* زر الإجراء (Action) المتجاوب */
        .reboot-btn {
            padding: clamp(10px, 2vh, 15px) clamp(25px, 5vw, 40px);
            background: transparent;
            border: 2px solid #00dbde;
            color: #00dbde;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            cursor: pointer;
            transition: all 0.4s ease;
            text-transform: uppercase;
            font-family: 'Cairo', sans-serif;
            font-weight: 750;
            border-radius: 8px;
        }

        .reboot-btn:hover {
            background: #00dbde;
            color: #050505;
            box-shadow: 0 0 25px #00dbde;
            transform: translateY(-3px);
        }

        /* خلفية النجوم المتحركة */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            animation: moveStars 200s linear infinite;
            opacity: 0.3;
            pointer-events: none;
        }

        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: 10000px 5000px; }
        }

        /* تحسينات إضافية للشاشات الصغيرة جداً */
        @media (max-width: 480px) {
            .error-code:hover {
                letter-spacing: 5px; /* تقليل المسافة في الهواتف الصغيرة لكيلا يخرج النص عن الشاشة */
            }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="container">
        <h1 class="error-code" onmouseover="glitch()" id="code">404</h1>
        <h2>يبدو أن هذا الرابط ضاع في الفضاء الرقمي</h2>
        <button class="reboot-btn" onclick="reboot()">إعادة النظام (Reboot)</button>
    </div>

    <script>
        function glitch() {
            let el = document.getElementById('code');
            el.style.transform = "skewX(15deg)";
            setTimeout(() => { el.style.transform = "skewX(0deg)"; }, 200);
        }

        function reboot() {
            alert("جارٍ استعادة البيانات... سيتم تحويلك للصفحة الرئيسية");
            window.location.href = "/"; 
        }
    </script>
</body>
</html>
